name: Live stack
description: Rust toolchain, the docker stand of nightly-live started, waited for and seeded.
inputs:
  stack:
    description: full, lean (no MySQL replica trio), core (the engines, loaders and object stores only) or none (the toolchain and the Python environment, no service).
    default: full
runs:
  using: composite
  steps:
    - uses: ./.github/actions/free-disk

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: "1.94"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      with:
        tool: cargo-nextest,uv
    - uses: ./.github/actions/cargo-deny

    - name: Start services
      if: ${{ inputs.stack != 'none' }}
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: |
        mkdir -p tests/.live-tmp
        case "$STACK" in
          core) services="postgres postgres-state mysql mssql minio fake-gcs azurite clickhouse duckdb oracle mongo" ;;
          lean) services="postgres postgres-state mysql mssql mssql-governor minio fake-gcs azurite toxiproxy pgbouncer pgbouncer-state proxysql mysql-tz proxysql-tz clickhouse-tz duckdb clickhouse postgres-cdc mysql-cdc mysql-reset mssql-cdc oracle mysql-stmt-84-lctn1 mongo" ;;
          *) services="postgres postgres-state mysql mssql mssql-governor minio fake-gcs azurite toxiproxy pgbouncer pgbouncer-state proxysql mysql-tz proxysql-tz clickhouse-tz duckdb clickhouse postgres-cdc mysql-cdc mysql-reset mssql-cdc mysql-primary mysql-replica mysql-replica-nolog oracle mysql-stmt-84-lctn1 mongo" ;;
        esac
        python3 -m dev.pytools.compose_up docker compose --profile pool --profile loaders --profile cdc --profile replica --profile governor --profile tz --profile mysql-stmt up -d $services
        uv run --frozen python -m dev.release_oracle.stand_stacks up "$STACK"
        sudo chmod -R 0777 tests/.live-tmp

    - name: Wait for services
      if: ${{ inputs.stack != 'none' }}
      shell: bash
      run: |
        python3 -m dev.pytools.stand_wait
        has() { [ -n "$(docker compose ps -q "$1")" ]; }
        docker compose exec -T postgres-state psql -U rivet -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE rivet_state_ci"
        has mssql-cdc && docker compose exec -T mssql-cdc /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -b -Q "IF DB_ID('rivet') IS NULL CREATE DATABASE rivet;"
        has mssql-governor && docker compose exec -T mssql-governor /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -b -Q "IF DB_ID('rivet') IS NULL CREATE DATABASE rivet;"

        true

    - name: Seed light fixtures (orders, etc.)
      if: ${{ inputs.stack != 'none' }}
      shell: bash
      run: |
        PGPASSWORD=rivet psql -h localhost -U rivet -d rivet -v ON_ERROR_STOP=1 -f dev/e2e/seed_pg.sql
        mysql -h 127.0.0.1 -u rivet -privet rivet < dev/e2e/seed_mysql.sql

    - name: Seed Oracle database
      if: ${{ inputs.stack != 'none' }}
      shell: bash
      run: docker compose exec -T oracle sqlplus -s rivet/rivet@localhost/FREEPDB1 < seeds/common/oracle.sql > /dev/null

    - name: Seed MSSQL database
      if: ${{ inputs.stack != 'none' }}
      shell: bash
      run: |
        docker compose cp dev/mssql/init.sql mssql:/tmp/init.sql
        docker compose exec -T mssql /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P 'Rivet_Passw0rd!' -C -b -i /tmp/init.sql

    - name: Seed heavy fixture (content_items)
      if: ${{ inputs.stack != 'none' }}
      shell: bash
      run: |
        uv run --frozen python -m dev.pytools.seed_fixture --source postgres --tier standard --yes
        PGPASSWORD=rivet psql -h localhost -U rivet -d rivet -c ANALYZE

    - name: Independent row-hash oracle deps
      if: ${{ inputs.stack != 'none' }}
      shell: bash
      run: python3 -m pip install --break-system-packages xxhash

    - name: Python environment
      shell: bash
      run: uv sync --frozen
