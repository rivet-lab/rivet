name: Free disk space
description: Removes the runner's preinstalled toolchains and prints the root disk before and after.
runs:
  using: composite
  steps:
    - name: Disk before
      shell: bash
      run: df -h /
    - uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
      with:
        large-packages: false
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        swap-storage: false
    - name: Disk after
      shell: bash
      run: df -h /
