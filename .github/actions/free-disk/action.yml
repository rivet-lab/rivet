name: Free disk space
description: Removes the runner's preinstalled toolchains only when the root disk has under 50 GiB free, and prints the root disk.
runs:
  using: composite
  steps:
    - name: Disk before
      id: disk
      shell: bash
      run: |
        df -h /
        avail_gib=$(( $(df --output=avail -k / | tail -1) / 1048576 ))
        echo "avail_gib=$avail_gib" >> "$GITHUB_OUTPUT"
        if [ "$avail_gib" -ge 50 ]; then echo "free-disk: ${avail_gib} GiB free, cleanup skipped"; fi
    - if: ${{ fromJSON(steps.disk.outputs.avail_gib) < 50 }}
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        large-packages: false
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        swap-storage: false
    - name: Disk after
      if: ${{ fromJSON(steps.disk.outputs.avail_gib) < 50 }}
      shell: bash
      run: df -h /
