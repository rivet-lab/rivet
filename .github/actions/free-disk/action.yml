name: Free disk space
description: Removes the runner's preinstalled toolchains and prints the root disk before and after.
runs:
  using: composite
  steps:
    - name: Disk before
      shell: bash
      run: df -h /
    - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        large-packages: false
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        swap-storage: false
    - name: Disk after
      shell: bash
      run: df -h /
