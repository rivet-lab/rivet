name: Unused dependencies

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, pre-0.34.0]

permissions:
  contents: read

jobs:
  shear:
    name: Unused dependencies (cargo-shear)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-shear@1.14.0
      - run: cargo shear --locked --deny-warnings
