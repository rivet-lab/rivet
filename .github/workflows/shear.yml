name: Unused dependencies

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, pre-0.34.0]

permissions:
  contents: read

jobs:
  shear:
    name: Unused dependencies (cargo-shear)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-shear@1.14.0
      - run: cargo shear --locked --deny-warnings
