name: Nightly Live

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dedupe:
    name: Dedupe against a dispatched run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      duplicate: ${{ steps.check.outputs.duplicate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/nightly_dedupe.py check

  start:
    name: Start the nightly
    needs: dedupe
    if: ${{ needs.dedupe.outputs.duplicate != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "no covering dispatch run, the nightly proceeds"

  live-full:
    name: Full live suite (incl. content_load)
    needs: start
    # Measured 57 min on 2026-10-02 (build 24, tests 27, the rest setup): ~1.6x.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/free-disk

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          # uv runs the rig's default oracle (dev/release_oracle/rig_oracle.py, pinned by uv.lock).
          tool: cargo-nextest,uv

      - name: Build release (rivet + seed + every test binary), before the stack starts
        # `--bin seed` builds the auxiliary src/bin/seed.rs target on top of
        # the default `rivet` binary so the heavy content_items fixture can
        # be populated without `cargo run`'s rebuild overhead. The seed bin is
        # gated behind the off-by-default `dev-seed` feature (so `cargo install`
        # never ships the destructive TRUNCATE tool), hence `--features dev-seed`.
        # The fat-LTO test link runs HERE, before ~20 containers take the runner's
        # memory: compiled with the stack up, the runner died mid-link with exit 143
        # ("The runner has received a shutdown signal") on 2026-09-29..10-02.
        # nextest reuses these artifacts (same profile, same features).
        run: |
          cargo build --release --bin rivet --bin seed --features dev-seed
          cargo test --release --no-run
          free -m

      - name: Start services
        # `proxysql` lives in the same `pool` docker-compose profile as
        # `pgbouncer` and is required by tests/live_pool_safety.rs MySQL
        # tests (`mysql_proxysql_*`); without it those tests fail in
        # `require_alive(LiveService::ProxySql)` before ever running.
        #
        # `duckdb` + `clickhouse` live in the `loaders` profile and back the
        # cross-engine type-roundtrip suite (tests/type_roundtrip.rs). Without
        # them the `--ignored` run fails 13 tests with `No such object:
        # rivet-duckdb` / `ClickHouse reachable on 127.0.0.1:8123` (pyarrow_*
        # cases also go through the shared rivet-duckdb exec helper).
        run: |
          # Same .live-tmp prolog as the e2e job: pre-create runner-owned
          # (the daemon would root-own a missing bind-mount source), then
          # re-open after ClickHouse chowns /work to uid 101 on boot. Without
          # it every test that writes a shared workdir EACCESes — the first
          # nightly after the cdc-oracle suite landed failed exactly there.
          mkdir -p tests/.live-tmp
          docker compose --profile pool --profile loaders --profile cdc --profile replica --profile governor --profile tz --profile mysql-stmt up -d postgres postgres-state mysql mssql mssql-governor minio fake-gcs azurite toxiproxy pgbouncer pgbouncer-state proxysql mysql-tz proxysql-tz clickhouse-tz duckdb clickhouse postgres-cdc mysql-cdc mysql-reset mssql-cdc mysql-primary mysql-replica mysql-replica-nolog oracle mysql-stmt-84-lctn1 mongo
          sudo chmod -R 0777 tests/.live-tmp

      - name: Wait for services
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U rivet && break || sleep 2; done
          echo "Waiting for the Postgres state server, then its per-run database (RIVET_TEST_STATE_URL)..."
          for i in $(seq 1 30); do docker compose exec -T postgres-state pg_isready -U rivet && break || sleep 2; done
          docker compose exec -T postgres-state psql -U rivet -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE rivet_state_ci"
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do docker compose exec -T mysql mysqladmin ping -h localhost -uroot -privet 2>/dev/null && break || sleep 2; done
          echo "Waiting for pgBouncer..."
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6432) 2>/dev/null && break || sleep 1; done
          echo "Waiting for pgBouncer in front of the state server..."
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6433) 2>/dev/null && break || sleep 1; done
          echo "Waiting for ProxySQL..."
          # 6033 is the client-facing MySQL protocol port; 6032 admin comes
          # up first but we wait for 6033 so backend wiring is in place.
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6033) 2>/dev/null && break || sleep 1; done
          echo "Waiting for ProxySQL in front of the +03:00 MySQL (mysql-tz, D5)..."
          for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/6097) 2>/dev/null && break || sleep 1; done
          echo "Waiting for Azurite..."
          # Blob emulator on :10000 — cloud_multipart_azure_* needs it. It was missing
          # from `up` here (the e2e job has it) and panicked the whole nightly suite nightly.
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/10000) 2>/dev/null && break || sleep 1; done
          echo "Waiting for ClickHouse..."
          # HTTP :8123/ping — the type_roundtrip clickhouse_load tests connect here.
          for i in $(seq 1 30); do curl -sf localhost:8123/ping >/dev/null 2>&1 && break || sleep 2; done
          echo "Waiting for duckdb loader..."
          # Long-running exec container; wait until its `import duckdb` healthcheck passes.
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' rivet-duckdb 2>/dev/null)" = "healthy" ] && break || sleep 2; done
          echo "Waiting for SQL Server..."
          # sqlcmd SELECT-1 healthcheck (start_period 30s); the live_mssql_* suites
          # connect + seed against it.
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' rivet-mssql 2>/dev/null)" = "healthy" ] && break || sleep 2; done
          echo "Waiting for Oracle..."
          # gvenzl faststart creates the app user on first start; healthcheck.sh is ready once the PDB takes logins.
          for i in $(seq 1 90); do docker compose exec -T oracle healthcheck.sh >/dev/null 2>&1 && break || sleep 2; done
          echo "Waiting for Mongo..."
          for i in $(seq 1 30); do docker compose exec -T mongo sh -c "mongosh --quiet --eval 'db.runCommand({ping:1})' || mongo --quiet --eval 'db.runCommand({ping:1})'" >/dev/null 2>&1 && break || sleep 2; done
          echo "Waiting for CDC services (cdc profile)..."
          for i in $(seq 1 30); do docker compose exec -T postgres-cdc pg_isready -U rivet && break || sleep 2; done
          for i in $(seq 1 30); do docker compose exec -T mysql-cdc mysqladmin ping -h localhost -uroot -privet 2>/dev/null && break || sleep 2; done
          for i in $(seq 1 40); do docker compose exec -T mssql-cdc /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -Q 'SELECT 1' >/dev/null 2>&1 && break || sleep 2; done
          docker compose exec -T mssql-cdc /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -Q "IF DB_ID('rivet') IS NULL CREATE DATABASE rivet;"
          echo "Waiting for SQL Server (governor instance)..."
          # The dedicated governor instance (`mssql-governor`, :1435) was added to
          # the e2e job's stack on 2026-08-17 and MISSED here — the runner-bypass
          # class, in workflow YAML: two hand-maintained service lists, and the
          # nightly's fell behind on the first change. Both governor canaries then
          # failed the 08-19 nightly with "requires MssqlGovernor reachable on
          # :1435". Same wait + same database seed as the e2e job; its two canaries
          # seed their own tables.
          for i in $(seq 1 40); do docker compose exec -T mssql-governor /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -Q 'SELECT 1' >/dev/null 2>&1 && break || sleep 2; done
          docker compose exec -T mssql-governor /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -Q "IF DB_ID('rivet') IS NULL CREATE DATABASE rivet;"

      - name: Seed light fixtures (orders, etc.)
        run: |
          PGPASSWORD=rivet psql -h localhost -U rivet -d rivet -f dev/e2e/seed_pg.sql
          mysql -h 127.0.0.1 -u rivet -privet rivet < dev/e2e/seed_mysql.sql

      - name: Seed Oracle database
        run: docker compose exec -T oracle sqlplus -s rivet/rivet@localhost/FREEPDB1 < seeds/common/oracle.sql > /dev/null

      - name: Seed MSSQL database
        # Create the `rivet` database (no init hook in the SQL Server image) so
        # the live_mssql_* recovery/resume/reconcile suites can connect + seed
        # their own per-test tables.
        run: |
          docker compose cp dev/mssql/init.sql mssql:/tmp/init.sql
          docker compose exec -T mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Rivet_Passw0rd!' -C -i /tmp/init.sql

      - name: Seed heavy fixture (content_items)
        # tests/live_content_load.rs asserts count >= 50_000 for the
        # `pg_content_export_under_update_pressure` test. Use a leaner
        # 60k-row fixture (~1 min) — that's enough to trigger WAL pressure
        # without inflating CI wall time with millions of rows.
        # The `pg_full_content_export_max_pressure` test requires 1M rows
        # and is intentionally not exercised here (still manual-only).
        # RIVET_SEED_I_KNOW=1 confirms the destructive TRUNCATE...CASCADE the
        # seed tool runs (the runtime safety gate; CI fixtures are throwaway).
        run: |
          RIVET_SEED_I_KNOW=1 ./target/release/seed \
            --target postgres \
            --users 1000 \
            --orders-per-user 5 \
            --events-per-user 5 \
            --page-views 5000 \
            --content-items 60000
          # The seed TRUNCATEs and refills; the tests now start seconds later (the
          # build moved ahead of the stack), before autovacuum re-reads the stats, and
          # audit_table_shortcut_row_estimate_matches_real_table saw a catalog estimate
          # of ~854 rows for a table of thousands (2026-10-02). ANALYZE is what autovacuum would do.
          PGPASSWORD=rivet psql -h localhost -U rivet -d rivet -c ANALYZE

      - name: Disk snapshot — post-build
        run: |
          df -h /
          free -m

      - name: Independent row-hash oracle deps
        # `xxhash` is what makes the row-hash check INDEPENDENT: it rebuilds the
        # canonical image from the spec in src/enrich.rs and hashes it with a
        # different library, so rivet is never compared against itself. Without
        # the package `live_batch_census` ASSERTS rather than falling back (the
        # self-oracle its helper refuses) — and that assert has failed this job
        # every night since 2026-08-30: nextest cancels on first failure, so the
        # run stopped at test 149 of 837 and 688 live tests went unexecuted for
        # 22 consecutive nights while the workflow still "ran". ci.yml has had
        # this exact step since the same breakage hit it there.
        run: python3 -m pip install --break-system-packages xxhash

      - name: Run FULL live suite
        env:
          RIVET_TEST_STATE_URL: postgresql://rivet:rivet@127.0.0.1:5433/rivet_state_ci
        run: |
          # nextest, not plain `cargo test`: tests/live_suite.rs's own header
          # says the per-test process isolation this consolidation relies on is
          # GONE under the default libtest harness — and getrusage(RUSAGE_
          # CHILDREN) claims (soak_spill's RSS ceiling) are unattributable when
          # sibling tests share one process (harness audit, 2026-08-29).
          cargo nextest run --release --run-ignored ignored-only --no-fail-fast \
            -E 'not (test(full_content_export_max_pressure) or test(validates) or test(edge_cases) or test(via_duckdb) or test(mongo) or test(warehouse_cell)
                 or test(readable_secondary) or test(mssql_checkpoint_follows_a_failover) or test(mssql_checkpoint_from_another_database)
                 or test(from_a_standby) or test(failover_to_the_standby) or test(bounded_on_a_standby) or test(on_a_standby)
                 or test(doctor_is_not_green_where_the_cdc_run_refuses_a_replica)
                 or test(loads_into_bigquery_or_refuses_by_column) or test(cleanup_source_never_deletes_parts)
                 or test(compact_after_a_source_alter) or test(a_non_unicode_database_round_trips) or test(range_chunk_shared_name_another_source_oracle)
                 or test(url_file_resolved_as_before_oracle) or test(url_file_follows_the_config_oracle)
                 or test(a_read_blocked_longer_than_thirty_seconds_still_completes) or test(open_defect_))'

      # Which live cells were green tonight: recorded from nextest's junit into the evidence
      # ledger and published as an artifact (CI cannot commit it; the stand machines do).
      - name: Record the night's green cells in the evidence ledger
        if: always()
        run: |
          python3 dev/pytools/evidence.py record --junit target/nextest/default/junit.xml --by nightly --at "${GITHUB_SHA::8}"
          python3 dev/pytools/evidence.py report | head -40
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-ledger
          path: |
            docs/evidence/last-green.yaml
            target/nextest/default/junit.xml
          if-no-files-found: warn
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::postgres"
          docker compose logs --no-color postgres | tail -200
          echo "::endgroup::"
          echo "::group::mysql"
          docker compose logs --no-color mysql | tail -200
          echo "::endgroup::"
          echo "::group::pgbouncer"
          docker compose logs --no-color pgbouncer | tail -200
          echo "::endgroup::"
          echo "::group::proxysql"
          docker compose logs --no-color proxysql | tail -200
          echo "::endgroup::"

      - name: Stop services
        if: always()
        run: docker compose down -v

  # MongoDB is version-sensitive where the SQL engines are not: the CDC
  # capability tier (4.4/5.0 current-state vs 6.0+ full-image pre-images) and the
  # until_current drain race behave differently per server version. This job runs
  # ONLY the Mongo live tests against each supported server, on a slim stack (no
  # SQL engines, no 2M-row fixture) so five versions stay cheap. `--wait` honors
  # the compose healthchecks, which fall back from `mongosh` to the legacy `mongo`
  # shell on 4.x.
  mongo-versions:
    name: Mongo live (v${{ matrix.mongo_version }})
    needs: start
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mongo_version: ["4.4", "5.0", "6.0", "7.0", "8.0"]
    env:
      MONGO_VERSION: ${{ matrix.mongo_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          # uv runs the rig's default oracle (dev/release_oracle/rig_oracle.py, pinned by uv.lock).
          tool: cargo-nextest,uv

      - name: Build release test binaries, before the stack starts
        run: |
          cargo test --release --no-run
          free -m

      - name: Start Mongo stack
        run: |
          mkdir -p tests/.live-tmp
          docker compose --profile replica --profile shard up -d --wait mongo mongo-rs mongo-auth mongo-rs2-a mongo-rs2-b mongos toxiproxy minio fake-gcs duckdb clickhouse
          sudo chmod -R 0777 tests/.live-tmp

      - name: Run Mongo live tests
        # Every live_suite test whose path names mongo, by the same `mongo` substring
        # the e2e and live-full jobs SKIP on — the live_mongo* / live_cdc_mongo modules,
        # the chunking_stand `stand_*_mongo` cells and the mongo cases of the
        # engine-agnostic modules (full cycle, compact, init, shape drift, soak).
        # An explicit name list here once left 14 of them with no CI runner at all.
        # `and not`: the one mongo test that also needs mssql-cdc, which this slim
        # stack does not start (`live+gate-only`; the release gate runs it).
        run: |
          cargo nextest run --release --run-ignored ignored-only --no-fail-fast \
            -E 'binary(live_suite) and test(mongo) and not (test(the_duckdb_oracle_reaches_sql_server_and_mongodb_too) or test(an_oplog_rolled_past_the_checkpoint) or test(open_defect_))'

      - name: Dump Mongo logs on failure
        if: failure()
        run: |
          for s in $(docker compose --profile replica --profile shard ps -a --services | grep '^mongo'); do
            echo "::group::$s"; docker compose logs --no-color "$s" | tail -100; echo "::endgroup::"
          done

      - name: Stop services
        if: always()
        run: docker compose down -v

  # REMOVED 2026-08-17: `mutants-nightly` (tier rotation + baseline ratchet).
  #
  # It never produced a verdict. Measured: the SMALLEST of its five tiers — 446
  # mutants over 4 files — hit the 360-minute ceiling and reported `cancelled`;
  # the other four hold 1138-1708. At the ~90s a mutant actually costs in CI
  # (dominated by the rebuild, not by the 3.7s test run) a six-hour night grades
  # about 200. The whole corpus is 18,212 mutants ≈ 450 hours. The rotation was
  # not slow, it was off by an order of magnitude — and it spent six hours of
  # runner a night to say so.
  #
  # The cost beyond runner time: `ci.yml`'s over-budget escape DEFERRED work to
  # it ("the tiered remainder goes to the rotation"), a claim about a mechanism
  # that graded nothing. Round 7 made that escape check the rotation EXISTED; it
  # could not check that the rotation FINISHED.
  #
  # What survives is the part that works: `--in-diff` on every PR. Bounded by
  # construction (changed lines only), it completes, and it catches real things —
  # on the branch that removed this job it caught three defects in that branch's
  # own code.
  #
  # What is lost, plainly: nothing now sweeps code no PR is touching. That
  # capability never actually existed — no tier ever finished — so this removes a
  # claim, not a check. `docs/mutants-baseline.txt` keeps its adjudicated
  # verdicts as a record and no longer has an automated consumer.

  # Version-matrix scout lane (staff class #3): the CDC conformance subset
  # against non-default engine tags. It FAILS the run: under continue-on-error
  # every cell went red on 2026-10-01..02 (no oracle reader, and a real MySQL 5.7
  # defect) while the run's verdict ignored them.
  cdc-version-scout:
    name: CDC vs ${{ matrix.engine }}:${{ matrix.tag }}
    needs: start
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: mysql, tag: "8.4", env: MYSQL_CDC_TAG }
          - { engine: mysql, tag: "5.7", env: MYSQL_CDC_TAG }
          - { engine: postgres, tag: "13", env: POSTGRES_CDC_TAG }
          - { engine: postgres, tag: "17", env: POSTGRES_CDC_TAG }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          # uv runs the rig's default oracle (dev/release_oracle/rig_oracle.py, pinned by uv.lock).
          tool: cargo-nextest,uv
      - name: Start the CDC stack at the scouted tag
        # `duckdb` is the rig's default oracle reader (rivet-duckdb); without it every
        # graded cell failed on `No such container: rivet-duckdb` (2026-10-01..02).
        run: |
          export ${{ matrix.env }}=${{ matrix.tag }}
          mkdir -p tests/.live-tmp
          docker compose --profile cdc up -d mysql-cdc postgres-cdc
          docker compose up -d --wait duckdb
          sudo chmod -R 0777 tests/.live-tmp
      - name: MySQL 5.7 is refused (no binlog_row_metadata), the expected outcome
        if: matrix.engine == 'mysql' && matrix.tag == '5.7'
        run: |
          cargo build --bin rivet
          dev/cdc/scout_mysql57_refusal.sh target/debug/rivet
      - name: Conformance subset
        if: matrix.engine != 'mysql' || matrix.tag != '5.7'
        run: |
          if [ "${{ matrix.engine }}" = "mysql" ]; then
            FILTER="live_cdc::cdc_"
          else
            FILTER="live_cdc::pg_cdc_"
          fi
          # `from_a_standby` and `failover_to_the_standby` need the PG 16 primary/standby pair
          # (dev/pytools/cdc_stand), which this lane does not start; the e2e job skips both for
          # the same reason (the failover cell was red here every night from 2026-10-13).
          cargo nextest run --run-ignored ignored-only --no-fail-fast \
            -E "binary(live_suite) and test($FILTER) and not (test(gcs) or test(toxiproxy) or test(from_a_standby) or test(failover_to_the_standby))"
      - name: Stop services
        if: always()
        run: docker compose down -v

  # Weekly 45-minute CDC soak (staff class #5): scheduler-style bounded runs
  # against continuous churn; asserts zero gaps across the whole window and a
  # flat RSS trend (last-quarter peak <= 1.5x first-quarter). Sundays only —
  # gate on the schedule day so the nightly stays fast.
  release-compat-artifacts:
    name: Cross-version artifact exchange (plan/apply, run/validate)
    needs: start
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          # uv runs the rig's default oracle (dev/release_oracle/rig_oracle.py, pinned by uv.lock).
          tool: cargo-nextest,uv
      - name: Download the previous release binary
        # Downloaded, never rebuilt: the release profile is fat-LTO, and the
        # published asset is what users actually run.
        run: |
          set -euo pipefail
          PREV=$(gh release list --limit 20 --json tagName,isPrerelease \
                   --jq '[.[] | select(.isPrerelease == false) | .tagName][0]')
          echo "baseline release: $PREV"
          # The asset is `rivet-<tag>-<triple>.tar.gz` — the VERSION sits between
          # the name and the triple, so the old `rivet-x86_64-...` glob matched
          # NOTHING and `gh release download` failed under `set -e` before a
          # single test ran. This job was red 10 of 10 nights, i.e. the
          # cross-version artifact contract was never once checked. The Makefile's
          # release-oracle-prev-bin target spells the same pattern correctly
          # (`rivet-$$tag-$$triple.tar.gz`); this copy had drifted.
          gh release download "$PREV" \
            --pattern "rivet-$PREV-x86_64-unknown-linux-gnu.tar.gz" --dir baseline --clobber
          cd baseline
          for f in *; do case "$f" in *.tar.gz) tar xzf "$f";; esac; done
          BIN=$(find . -type f -name rivet | head -1)
          test -n "$BIN" || { echo "no rivet binary in the release asset"; exit 1; }
          chmod +x "$BIN"
          echo "RIVET_BASELINE=$PWD/$BIN" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Start postgres
        run: docker compose up -d postgres
      - name: Exchange artifacts between the two versions
        # The axis the offline PR gate cannot run: an artifact written by one
        # version consumed by the other. It is where the sealed-plan integrity
        # break surfaced — a `#[serde(default)]` field that deserialized fine
        # and still shifted the plan's hash, failing apply in BOTH directions.
        run: |
          cargo build --bin rivet
          python3 -m dev.pytools.release_compat artifacts
      - name: Stop services
        if: always()
        run: docker compose down -v || true

  soak-cdc:
    name: CDC soak (weekly)
    needs: start
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sunday gate
        id: day
        run: echo "sunday=$([ "$(date -u +%u)" = "7" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/free-disk
        if: steps.day.outputs.sunday == 'yes'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
        if: steps.day.outputs.sunday == 'yes'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.day.outputs.sunday == 'yes'
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          # uv runs the rig's default oracle (dev/release_oracle/rig_oracle.py, pinned by uv.lock).
          tool: cargo-nextest,uv
      - name: Start CDC stack
        if: steps.day.outputs.sunday == 'yes'
        run: docker compose --profile cdc up -d mysql-cdc
      - name: Build + soak 45m
        if: steps.day.outputs.sunday == 'yes'
        run: |
          # `uv run`: the soak's gap check reads through the uv-pinned duckdb package
          # (dev/pytools/duckcli.py), never a CLI on PATH; under bare python3 it
          # refused with "duckdb missing" on 2026-09-27.
          cargo build --release
          uv run python -m dev.pytools.cdc_soak soak 45 target/release/rivet
      - name: Stop services
        if: always()
        run: docker compose down -v

  mysql-statement-truth:
    name: MySQL statement truth (corpus vs the stand)
    needs: start
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the statement-truth stand
        run: python3 dev/pytools/statement_truth.py mysql up
      - name: Regenerate the corpus from the servers and diff it against the fixtures
        run: python3 dev/pytools/statement_truth.py mysql check
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest,uv
      - name: Run the statement-seam cells against each stand
        run: |
          for port in 3331 3332 3333; do
            RIVET_TEST_MYSQL_STMT_URL="mysql://root@127.0.0.1:$port" \
              cargo nextest run --run-ignored ignored-only --no-fail-fast \
              -E 'binary(live_suite) and test(live_cdc_mysql_statement_seam::)'
          done
      - name: Dump stand logs on failure
        if: failure()
        run: docker compose --profile mysql-stmt logs --no-color --tail 100
      - name: Stop the stand
        if: always()
        run: python3 dev/pytools/statement_truth.py mysql down

  # E2E: one nextest archive, four legs on a full stack, one census job.
  e2e-build:
    name: E2E build (nextest archive)
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e-debug
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - name: Build rivet and every test binary (debug), once
        run: |
          cargo nextest archive --archive-file "$RUNNER_TEMP/e2e-nextest.tar.zst"
          ls -l "$RUNNER_TEMP/e2e-nextest.tar.zst"
          df -h /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nextest-archive
          path: ${{ runner.temp }}/e2e-nextest.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.leg }})
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [pre, 1/3, 2/3, 3/3]
    env:
      RIVET_TEST_STATE_URL: postgresql://rivet:rivet@127.0.0.1:5433/rivet_state_ci
      RIVET_SKIP_LOG: ${{ github.workspace }}/target/rivet-skips.log
      RIVET_ORACLE_LOG: ${{ github.workspace }}/target/rivet-oracle.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk

      - name: Start services (in the background)
        run: |
          mkdir -p tests/.live-tmp
          ( docker compose --profile pool --profile cdc --profile replica --profile governor --profile tz --profile mysql-stmt up -d postgres postgres-state mysql mssql mssql-governor minio fake-gcs azurite toxiproxy pgbouncer pgbouncer-state proxysql mysql-tz proxysql-tz clickhouse-tz postgres-cdc mysql-cdc mysql-reset mssql-cdc mysql-primary mysql-replica mysql-replica-nolog duckdb clickhouse oracle mysql-stmt-84-lctn1 mongo > "$RUNNER_TEMP/compose.log" 2>&1; echo $? > "$RUNNER_TEMP/compose.rc" ) &

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: ${{ matrix.leg == 'pre' }}
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ matrix.leg == 'pre' }}
        with:
          shared-key: e2e-debug
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest,uv

      - name: Independent row-hash oracle deps
        run: python3 -m pip install --break-system-packages xxhash

      - name: Build rivet and the small suites' binaries (debug)
        if: ${{ matrix.leg == 'pre' }}
        run: |
          cargo build
          cargo test --no-run

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ matrix.leg != 'pre' }}
        with:
          name: e2e-nextest-archive
          path: ${{ runner.temp }}
      - name: Services are up
        timeout-minutes: 25
        run: |
          for i in $(seq 1 600); do [ -f "$RUNNER_TEMP/compose.rc" ] && break; sleep 2; done
          if [ ! -f "$RUNNER_TEMP/compose.rc" ]; then
            echo "::error::docker compose up did not finish within 20 minutes"
            cat "$RUNNER_TEMP/compose.log"; docker compose ps -a; exit 1
          fi
          cat "$RUNNER_TEMP/compose.log"
          [ "$(cat "$RUNNER_TEMP/compose.rc")" = 0 ]
          sudo chmod -R 0777 tests/.live-tmp
          df -h /

      - name: Wait for services
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U rivet && break || sleep 2; done
          echo "Waiting for the Postgres state server, then its per-run database (RIVET_TEST_STATE_URL)..."
          for i in $(seq 1 30); do docker compose exec -T postgres-state pg_isready -U rivet && break || sleep 2; done
          docker compose exec -T postgres-state psql -U rivet -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE rivet_state_ci"
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do docker compose exec -T mysql mysqladmin ping -h localhost -uroot -privet 2>/dev/null && break || sleep 2; done
          echo "Waiting for pgBouncer..."
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6432) 2>/dev/null && break || sleep 1; done
          echo "Waiting for pgBouncer in front of the state server..."
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6433) 2>/dev/null && break || sleep 1; done
          echo "Waiting for ProxySQL..."
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6033) 2>/dev/null && break || sleep 1; done
          echo "Waiting for ProxySQL in front of the +03:00 MySQL (mysql-tz, D5)..."
          for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/6097) 2>/dev/null && break || sleep 1; done
          echo "Waiting for Azurite..."
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/10000) 2>/dev/null && break || sleep 1; done
          echo "Waiting for SQL Server..."
          for i in $(seq 1 40); do docker compose exec -T mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -Q 'SELECT 1' >/dev/null 2>&1 && break || sleep 2; done
          for i in $(seq 1 40); do docker compose exec -T mssql-governor /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -Q 'SELECT 1' >/dev/null 2>&1 && break || sleep 2; done
          echo "Waiting for CDC services (cdc profile)..."
          for i in $(seq 1 30); do docker compose exec -T postgres-cdc pg_isready -U rivet && break || sleep 2; done
          for i in $(seq 1 30); do docker compose exec -T mysql-cdc mysqladmin ping -h localhost -uroot -privet 2>/dev/null && break || sleep 2; done
          for i in $(seq 1 40); do docker compose exec -T mssql-cdc /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Rivet_Passw0rd!' -C -Q 'SELECT 1' >/dev/null 2>&1 && break || sleep 2; done
          echo "Waiting for replica pair (replica profile)..."
          for i in $(seq 1 30); do docker compose exec -T mysql-primary mysqladmin ping -h localhost -uroot -privet 2>/dev/null && break || sleep 2; done
          for i in $(seq 1 60); do docker compose exec -T mysql-stmt-84-lctn1 mysql -h 127.0.0.1 -uroot -e "select 1" >/dev/null 2>&1 && break || sleep 2; done
          for i in $(seq 1 30); do docker compose exec -T mysql-replica mysqladmin ping -h localhost -uroot -privet 2>/dev/null && break || sleep 2; done
          for i in $(seq 1 90); do docker compose exec -T oracle healthcheck.sh >/dev/null 2>&1 && break || sleep 2; done
          echo "Waiting for Mongo..."
          for i in $(seq 1 30); do docker compose exec -T mongo sh -c "mongosh --quiet --eval 'db.runCommand({ping:1})' || mongo --quiet --eval 'db.runCommand({ping:1})'" >/dev/null 2>&1 && break || sleep 2; done

      - name: Seed databases
        run: |
          PGPASSWORD=rivet psql -h 127.0.0.1 -U rivet -d rivet -f dev/e2e/seed_pg.sql
          mysql -h 127.0.0.1 -u rivet -privet rivet < dev/e2e/seed_mysql.sql

      - name: Seed Oracle database
        run: docker compose exec -T oracle sqlplus -s rivet/rivet@localhost/FREEPDB1 < seeds/common/oracle.sql > /dev/null

      - name: Seed MSSQL database
        run: |
          docker compose cp dev/mssql/init.sql mssql:/tmp/init.sql
          docker compose exec -T mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Rivet_Passw0rd!' -C -i /tmp/init.sql

      - name: Seed MSSQL-governor database
        run: |
          docker compose exec -T mssql-governor /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Rivet_Passw0rd!' -C \
            -Q "IF DB_ID('rivet') IS NULL CREATE DATABASE rivet;"

      - name: Seed MSSQL-CDC database
        run: |
          docker compose exec -T mssql-cdc /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Rivet_Passw0rd!' -C \
            -Q "IF DB_ID('rivet') IS NULL CREATE DATABASE rivet;"

      - name: Type-golden tests (semantic gate)
        if: ${{ !cancelled() && matrix.leg == 'pre' }}
        run: cargo test --test live_type_golden -- --ignored

      - name: Type round-trip validators — DuckDB · ClickHouse · pyarrow (semantic gate)
        if: ${{ !cancelled() && matrix.leg == 'pre' }}
        run: cargo test --test type_roundtrip -- --include-ignored --skip bigquery

      - name: Differential correctness at scale (DuckDB vs source)
        if: ${{ !cancelled() && matrix.leg == 'pre' }}
        run: cargo test --test live_differential -- --ignored

      - name: Create matrix navigation links
        if: ${{ !cancelled() && matrix.leg == 'pre' }}
        env:
          RIVET_BIN: ${{ github.workspace }}/target/debug/rivet
        run: python3 -m dev.pytools.matrix_common setup-links

      - name: PR regression matrices (cli + cfg + path)
        if: ${{ !cancelled() && matrix.leg == 'pre' }}
        env:
          RIVET_BIN: ${{ github.workspace }}/target/debug/rivet
        shell: bash
        run: |
          set -o pipefail
          python3 -m dev.pytools.matrices --tier=pr --skip-compose | tee dev/matrices/run.log

      - name: Upload matrix logs on failure
        if: ${{ failure() && matrix.leg == 'pre' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrices-pr-logs
          path: |
            dev/cli_matrix/logs/
            dev/cfg_matrix/logs/
            dev/path_matrix/logs/
          retention-days: 14

      - name: Run E2E test suite
        if: ${{ !cancelled() && matrix.leg == 'pre' }}
        env:
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          RIVET: ./target/debug/rivet
        run: python3 -m dev.pytools.e2e

      - name: State lib tests on the Postgres state backend
        if: ${{ !cancelled() && matrix.leg == 'pre' }}
        run: python3 -m dev.release_oracle.state_lib

      - name: Ignored doc-tests
        if: ${{ !cancelled() && matrix.leg == 'pre' }}
        run: cargo test --doc -- --ignored

      - name: Run live cargo integration tests
        if: ${{ !cancelled() && matrix.leg != 'pre' }}
        run: |
          cargo nextest run --archive-file "$RUNNER_TEMP/e2e-nextest.tar.zst" \
          --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
          --profile pr --run-ignored only --partition "count:${{ matrix.leg }}" \
          -- --skip content_export --skip validates --skip edge_cases \
          --skip via_duckdb --skip mongo --skip warehouse_cell \
          --skip readable_secondary --skip mssql_checkpoint_follows_a_failover \
          --skip mssql_checkpoint_from_another_database --skip from_a_standby \
          --skip failover_to_the_standby --skip bounded_on_a_standby --skip on_a_standby \
          --skip doctor_is_not_green_where_the_cdc_run_refuses_a_replica \
          --skip loads_into_bigquery_or_refuses_by_column \
          --skip cleanup_source_never_deletes_parts --skip compact_after_a_source_alter \
          --skip a_non_unicode_database_round_trips \
          --skip range_chunk_shared_name_another_source_oracle \
          --skip url_file_resolved_as_before_oracle \
          --skip url_file_follows_the_config_oracle \
          --skip a_read_blocked_longer_than_thirty_seconds_still_completes \
          --skip open_defect_

      - name: Kernel OOM kills (on failure)
        if: ${{ failure() }}
        run: sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process' || echo "no OOM kill in the kernel log"

      - name: Disk snapshot
        if: ${{ !cancelled() }}
        run: df -h /

      - name: This leg's skip and verdict logs
        if: ${{ !cancelled() }}
        run: mkdir -p target && touch "$RIVET_SKIP_LOG" "$RIVET_ORACLE_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: |
            target/rivet-skips.log
            target/rivet-oracle.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  e2e-matrix:
    name: E2E matrix
    needs: [start, e2e]
    if: ${{ always() && needs.start.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every leg passed
        run: |
          echo "e2e legs: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = success ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() }}
        with:
          pattern: e2e-logs-*
          path: e2e-logs
      - name: One log of the whole matrix
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target
          cat e2e-logs/*/rivet-skips.log > target/rivet-skips.log
          cat e2e-logs/*/rivet-oracle.log > target/rivet-oracle.log
          wc -l e2e-logs/*/*.log target/rivet-skips.log target/rivet-oracle.log

      - name: Self-skip census
        if: ${{ !cancelled() }}
        env:
          LACKING: |
            BIGQUERY_TEST_PROJECT
            SNOWFLAKE_TEST_CONNECTION
            RIVET_SF_CONNECTION
            RIVET_SNOWFLAKE_ACCOUNT
            RIVET_TEST_EXCLUSIVE
            pg18-batch (:5518)
            RIVET_PREV_RELEASE_BIN
            RIVET_MIGRATION_CARRIER_BIN
            RIVET_LEASE_CARRIER_BIN
            macOS `hdiutil`
            RIVET_GATE_STATE_URL
        run: |
          python3 -m dev.release_oracle.skip_census target/rivet-skips.log --lacking "$LACKING"

      - name: Rig oracle verdict census
        if: ${{ !cancelled() }}
        run: python3 -m dev.release_oracle.skip_census --verdicts target/rivet-oracle.log --lane ci

  nightly-verdict:
    name: Nightly verdict
    needs: [dedupe, start, live-full, mongo-versions, cdc-version-scout, release-compat-artifacts, soak-cdc, mysql-statement-truth, e2e-build, e2e, e2e-matrix]
    if: ${{ always() && needs.start.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Name the red jobs and the merges since the last green nightly
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          red=$(python3 -c 'import json,os; print(" ".join(k for k, v in json.loads(os.environ["NEEDS"]).items() if v["result"] != "success"))')
          if [ -z "$red" ]; then echo "nightly green"; exit 0; fi
          green=$(python3 .github/scripts/nightly_dedupe.py green)
          { echo "### Nightly red: $red"; python3 .github/scripts/nightly_range.py --green "$green" --head "$GITHUB_SHA"; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error title=Nightly red::$red"
          exit 1
