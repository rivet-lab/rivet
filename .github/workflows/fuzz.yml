name: Fuzz (nightly)

# Coverage-guided fuzzing of Rivet's untrusted-input parsers: the config YAML
# loader, the PostgreSQL `test_decoding` text decoder (the richest, historically
# bug-prone parse surface), and the MongoDB resume-token BSON decoder. Runs each
# target for a few minutes nightly; a crash fails the job and uploads the
# reproducing input. Fuzzing needs nightly Rust (libFuzzer / -Zsanitizer), so it
# lives in its own workflow off the stable CI.
on:
  schedule:
    - cron: "0 5 * * *" # nightly, ahead of the working day
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "seconds to fuzz each target"
        default: "300"

permissions:
  contents: read

# Pinned nightly. The rolling `nightly` hit a rustc ICE (~2026-07-24) compiling
# tokio under `-Zsanitizer=address`, which `cargo fuzz` enables — every target
# failed to BUILD (not a Rivet bug). This date is the last nightly proven to build
# the fuzz targets. Bump it once upstream fixes the ICE: run `cargo +<date> fuzz
# build` locally first, and only forward to a nightly that compiles clean.
env:
  FUZZ_NIGHTLY: nightly-2026-07-22

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [config_from_yaml, pg_test_decoding, mongo_resume_token, spill_frame_decode, sql_query_text, redact_text]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo install cargo-fuzz --locked
      - name: Seed the corpus
        run: |
          mkdir -p "fuzz/corpus/${TARGET}"
          cp -n "fuzz/seeds/${TARGET}"/* "fuzz/corpus/${TARGET}/" || true
        env:
          TARGET: ${{ matrix.target }}
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '300' }}
        run: |
          cargo "+$FUZZ_NIGHTLY" fuzz run "${TARGET}" -- \
            -max_total_time="${MAX_TOTAL_TIME}" \
            -rss_limit_mb=4096
      - name: Upload crash reproducer on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
