# cargo-audit configuration — https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# Policy: an advisory stays on this ignore list ONLY if (a) there is no
# upstream fix AND (b) the vulnerable code path is not reachable from Rivet's
# runtime (or the risk is practically non-exploitable given how Rivet runs).
# Each entry below documents the reachability analysis; re-evaluate on every
# release. Upgrades that remove the ignore are always preferred over keeping
# it.
#
# Removed from this list in 0.3.0:
# - RUSTSEC-2025-0119 (number_prefix unmaintained) — fixed by bumping
#   indicatif 0.17 → 0.18, which switched to the maintained `unit-prefix`.

[advisories]
ignore = [
    # ─── RUSTSEC-2023-0071 ── rsa timing sidechannel ──
    # Path: opendal → reqsign → rsa (GCS service-account JWT signing only;
    # AWS S3 signing is HMAC-SHA256 and does not touch `rsa`).
    # Status: no fix upstream in the `rsa` crate.
    # Reachability: exploited only by a co-located attacker able to measure
    # per-signature wall-clock timing with sub-microsecond precision. Rivet
    # is a batch CLI performing a handful of signatures per export; a
    # network-remote attacker cannot extract key material through this path.
    # Action: track `rsa` upstream; drop this entry the day a patched release
    # lands. Until then, documented residual risk.
    "RUSTSEC-2023-0071",

    # ─── RUSTSEC-2024-0436 ── paste unmaintained ──
    # Path: parquet → paste (proc-macro).
    # Reachability: paste is a `proc-macro = true` crate. It runs only at
    # compile time inside the parquet build; **zero runtime code** ships.
    # This advisory is an "unmaintained" warning, not a CVE — there is no
    # vulnerability to exploit.
    # Action: remove if/when parquet migrates away from paste.
    "RUSTSEC-2024-0436",

    # ─── RUSTSEC-2026-0097 ── rand unsound under custom logger ──
    # Required preconditions for the UB to trigger (all of them):
    #   (1) `rand::rng()` called from a custom `log::Log` implementation
    #   (2) That call happens during the thread_rng reseed path (every 64 kB
    #       of generated data)
    #   (3) Trace-level OR warn-level logging is enabled AND the OS RNG
    #       (`getrandom`) fails to provide fresh seed material.
    # Rivet uses `env_logger::init()` (default `log::Log`), which never calls
    # `rand`. We do not ship a custom logger; no code in `src/` calls
    # `log::set_logger`. The unsafe path is unreachable.
    # Action: drop once upstream PR https://github.com/rust-random/rand/pull/1763
    # lands and crates we depend on pick up the fix.

    # ─── tiberius (MSSQL) rustls advisories — REMOVED, no longer suppressed ──
    # RUSTSEC-2026-0104/0098/0099 (rustls-webpki 0.101) and RUSTSEC-2025-0134
    # (rustls-pemfile) used to enter via tiberius' `rustls` feature. Switching
    # tiberius to `vendored-openssl` (OpenSSL on every platform) took rustls 0.21
    # / rustls-webpki 0.101 / rustls-pemfile out of the tree entirely, so there is
    # nothing left to ignore. `native-tls` was NOT usable: on macOS it resolves to
    # SecureTransport, which cannot complete SQL Server's TDS-wrapped TLS
    # handshake. See the tiberius dep comment in Cargo.toml.

    # ─── quick-xml DoS advisories (2026-06-29) ──
    # Path: reqsign 0.16 → quick-xml 0.37 and opendal 0.55 → quick-xml 0.38;
    #       both parse XML responses from the operator-configured cloud
    #       endpoint (S3 auth/list bodies etc.).
    # Status: fix requires quick-xml >= 0.41; reqsign pins ^0.37 and opendal
    #       ^0.38 — verified 2026-07-02 (`cargo update --precise 0.41.0` fails
    #       version selection; `cargo update -p reqsign -p opendal` moves
    #       nothing). No upstream release path yet.
    # Reachability: both are DoS-class (unbounded namespace-declaration
    #       allocation; quadratic duplicate-attribute check), triggered by a
    #       malicious XML response. Rivet is a batch CLI talking to endpoints
    #       the operator configured; the blast radius of a hostile endpoint is
    #       one failed/OOM-killed run, re-run under at-least-once semantics —
    #       no RCE, no data corruption. Residual risk documented.
    # Action: drop both the day reqsign/opendal release on quick-xml >= 0.41.
    "RUSTSEC-2026-0194", # quick-xml: quadratic duplicate-attribute check
    "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-declaration allocation

    # ─── zstd 0.13.3 / zstd-safe 7.3.0 via parquet 59 and mysql_common binlog (RUSTSEC-2026-0391, -0395..0406) ──
    # Path: parquet =59.0.0 (ZSTD page codec) -> zstd 0.13.3; mysql 28.0.4 -> mysql_common 0.37.3 (binlog) -> zstd 0.13.3.
    # Status: the fixes need zstd >= 0.14.3 / zstd-safe >= 8.2.0; mysql_common 0.37.3 and 0.38.2 require zstd "0.13",
    #       and parquet is pinned to 59.0.0 (2026-11-01), so no path in the tree reaches zstd 0.14.
    # Reachability, parquet: zstd::bulk Compressor/Decompressor only (compress2, decompressDCtx, an empty
    #       load_dictionary); no stream, no with_context, no NbWorkers, no dictionary, no clone, no seekable.
    #       The zstd-safe features compiled are arrays, legacy, std, zdict_builder (cargo tree -e features):
    #       experimental (0395, 0399, 0402, 0404), seekable (0396, 0398, 0405) and zstdmt (0406) are off;
    #       0391, 0397, 0403 are stream APIs (0403 names the bulk API unaffected); 0400 needs a stream open
    #       on the context; 0401 train_from_buffer is not called.
    # Reachability, mysql: only CDC on MySQL with compressed binlog transactions, a fresh zstd::Decoder per payload.
    # Action: drop all entries when mysql_common requires zstd >= 0.14 and parquet moves past 59 (#724).
    "RUSTSEC-2026-0391", # zstd: stream context reuse leak (mysql_common binlog)
    "RUSTSEC-2026-0398", # zstd-safe: Seekable::decompress (seekable feature off)
    "RUSTSEC-2026-0403", # zstd-safe: uninit memory on failed legacy-frame decode
    "RUSTSEC-2026-0395", # zstd-safe: StableInBuffer on CCtx (encoder only)
    "RUSTSEC-2026-0396", # zstd-safe: Seekable reads (seekable feature off)
    "RUSTSEC-2026-0397", # zstd-safe: OutBuffer::around_pos (decoder uses OutBuffer::around)
    "RUSTSEC-2026-0399", # zstd-safe: init_using_cdict/ddict (no dictionaries)
    "RUSTSEC-2026-0400", # zstd-safe: dictionary after one-shot call (no dictionaries)
    "RUSTSEC-2026-0401", # zstd-safe: train_from_buffer (zdict training not called)
    "RUSTSEC-2026-0402", # zstd-safe: CCtx::try_clone (encoder only)
    "RUSTSEC-2026-0404", # zstd-safe: DCtx::try_clone (not called)
    "RUSTSEC-2026-0405", # zstd-safe: InBuffer::pos set out of range (decoder uses InBuffer::around)
    "RUSTSEC-2026-0406", # zstd-safe: multithreaded CCtx with unfinished frame (encoder only)

    # ─── unsafe-libyaml unmaintained (RUSTSEC-2024-0449), 2026-10-29 ──
    # Path: serde_yaml_ng 0.10.0 -> unsafe-libyaml 0.2.11. Warning, not a CVE; the crate has no
    #       patched release. Parses only operator-written YAML config. Replacement (serde_norway,
    #       unsafe-libyaml-norway) is a parser swap, tracked in #724.
    "RUSTSEC-2024-0449",
]
