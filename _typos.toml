[files]
extend-exclude = [
  "*.patch",
  "*.json",
  "Cargo.lock",
  "uv.lock",
  "docs/mutants-baseline.txt",
  "proptest-regressions/",
  "target*/",
]

[default]
extend-ignore-re = [
  '\b[0-9a-f]{7,40}\b',
  '\b[A-Z]{3,}[a-z]{1,5}\b',
  '[A-Za-z0-9+/]{40,}',
  'caf\\u\{e9\}',
  'donn\\u\{e9\}es',
  'Nam libero tempore[^"]*',
  'Nulla facilisi',
  'METADATAtailtail',
  'pg_fo_(ckpt|nockpt|follow)',
  '\bnd_schema\b|rivet_nd_slot',
  'mons\?\(\?:ths\?\)\?',
  '"rror" in l',
  '`ture`',
  'validat\.\*pass\|pass\.\*validat',
  'fixe\[sd\]',
  '\|certificat\|',
  'rivet_cdc_inh',
  '`brin`',
  '\(DAA\)',
]
extend-ignore-identifiers-re = [
  '^\w*(childs|processs|familys)(_\w*)?$',
  '^(acccess_key_env|checkpont|qeury|colum|oders|SELCT|SELET|SELEC|selec|fromt|postgress|compre)$',
]

[default.extend-words]
unparseable = "unparseable"
mis = "mis"
lits = "lits"
tme = "tme"
strat = "strat"
lok = "lok"
alikes = "alikes"
aks = "aks"
raison = "raison"
bre = "bre"
iif = "iif"
caf = "caf"
