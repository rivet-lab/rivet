[files]
extend-exclude = [
  "*.patch",
  "*.json",
  "Cargo.lock",
  "uv.lock",
  "docs/mutants-baseline.txt",
  "proptest-regressions/",
  "target*/",
]

[default]
extend-ignore-re = [
  '\b[0-9a-f]{7,40}\b',
  '\b[A-Z]{3,}[a-z]{1,5}\b',
  '[A-Za-z0-9+/]{40,}',
  'caf\\u\{e9\}',
  'donn\\u\{e9\}es',
  'Nam libero tempore[^"]*',
  'Nulla facilisi',
  'METADATAtailtail',
]
extend-ignore-identifiers-re = [
  '\w*(childs|processs|familys)(_\w*)?',
  '(acccess_key_env|checkpont|qeury|colum|oders|SELCT|SELET|SELEC|selec|fromt|postgress|compre)',
]

[default.extend-words]
unparseable = "unparseable"
mis = "mis"
lits = "lits"
tme = "tme"
strat = "strat"
lok = "lok"
fo = "fo"
nd = "nd"
inh = "inh"
brin = "brin"
alikes = "alikes"
aks = "aks"
gti = "gti"
