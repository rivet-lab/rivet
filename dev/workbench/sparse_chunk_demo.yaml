# Requires: orders_sparse filled (note: the seed truncates every fixture table):
#   python3 -m dev.pytools.seed_fixture --source postgres --tier standard --sparse-rows 500000 --sparse-gap 2000000 --yes
# Dense ids in the same table (min..max ~ row count; chunk on `id` is reasonable):
#   python3 -m dev.pytools.seed_fixture --source postgres --tier standard --sparse-rows 500000 --sparse-gap 1 --yes
#
# `orders_sparse_on_id` — chunk on physical id → wide min..max, many windows (heavy plan).
# `orders_sparse_keyset` — keyset (`chunk_by_key: id`) pages by rows, so the id gaps cost nothing.
# `orders_sparse_dense` — manual view with chunk_rownum (legacy / explicit SQL; static tables only).
#
# Goal: few files / one file — prefer keyset or a dense key; not sparse BETWEEN on `id`.
# For one file: chunk_size >= row count on the dense ordinal (see `orders_sparse_dense_onefile`).

source:
  type: postgres
  url: "postgresql://rivet:rivet@localhost:5432/rivet"

exports:
  - name: orders_sparse_on_id
    query: "SELECT id, payload FROM orders_sparse"
    mode: chunked
    chunk_column: id
    chunk_size: 500000
    chunk_checkpoint: true
    format: csv
    destination:
      type: local
      path: ./output/sparse_chunk

  - name: orders_sparse_keyset
    table: orders_sparse
    mode: chunked
    chunk_by_key: id
    chunk_size: 10000
    format: csv
    destination:
      type: local
      path: ./output/sparse_chunk

  - name: orders_sparse_dense
    query: "SELECT id, payload, chunk_rownum FROM orders_sparse_for_export"
    mode: chunked
    chunk_column: chunk_rownum
    chunk_size: 10000
    chunk_checkpoint: true
    format: csv
    destination:
      type: local
      path: ./output/sparse_chunk

  # One output file for the whole table (if rows ≤ chunk_size on dense key). Raise chunk_size for bigger seeds.
  - name: orders_sparse_dense_onefile
    query: "SELECT id, payload, chunk_rownum FROM orders_sparse_for_export"
    mode: chunked
    chunk_column: chunk_rownum
    chunk_size: 2000000
    format: csv
    destination:
      type: local
      path: ./output/sparse_chunk
