    class: "`rivet state copy` splices the SQLite state path into a `file:` URI unescaped, so a path holding `#`, `?` or `%` attaches a different file (an empty one SQLite creates beside the directory, or the file a `%41` decodes to), and a source that holds no state after the attach is copied as empty: 0 rows, exit 0"
