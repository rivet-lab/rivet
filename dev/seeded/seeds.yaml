
seeds:

  - name: cdc-hot-added-column-dropped
    class: "a column added to a captured table while a CDC run is open is not in the run's schema: its values are dropped and acked, exit 0 (SQL Server: the run ends clean over a column its capture instance never carried)"
    history: "issue #644, a DBA's question on 2026-10-19; RED on main 2026-10-21 (the rig oracle: source column `c` is absent from the delivered parquet, PostgreSQL, MySQL and SQL Server)"
    scope: source
    patch: cdc-hot-added-column-dropped/shared.patch
    engines:
      postgres:
        cells: [pg_cdc_a_column_added_while_a_run_is_open_lands_every_value, pg_cdc_a_drop_and_add_at_one_arity_while_a_run_is_open_lands_under_the_new_name, "lib:a_column_added_while_the_run_is_open_continues_in_a_new_part_with_its_values"]
      mysql:
        cells: [mysql_cdc_a_column_added_while_a_run_is_open_lands_every_value, a_column_added_while_a_mysql_cdc_run_is_open_loads_into_clickhouse_with_every_value, mysql_cdc_a_drop_and_add_at_one_arity_while_a_run_is_open_lands_under_the_new_name]
      mssql:
        cells: [mssql_cdc_a_column_added_while_a_run_is_open_stops_by_code]
      mongo:
        na: "a MongoDB change lands the whole document in its one `document` column, so a field added while the run is open is a value in it, never a column the run lacks (mongo_cdc_a_field_added_while_a_run_is_open_is_in_the_document, live_cdc_schema_drift.rs)"
      oracle:
        na: "Oracle CDC only drains to the SCN current at open (`until_current: false` is refused) and resolves its schema after it, so a run never reads a change written after its schema; an ADD COLUMN inside the window is refused before any write as RIVET_SOURCE_CDC_UNDECODABLE (oracle_cdc_a_change_older_than_an_alter_is_refused_by_code), and one between runs is delivered with its values (oracle_cdc_picks_up_a_column_added_between_runs)"

  - name: cdc-roll-checkpoints-its-trigger
    class: "the roll a column added while a CDC run is open forces checkpoints and acknowledges the position of the change that carried the column before that change is written: a stop right after the roll resumes past it and the row is never delivered, exit 0 (PostgreSQL also advances the slot past it)"
    history: "found 2026-10-29 by a rivet-verifier probe (a MySQL continuous run, INSERT 3, ALTER TABLE ADD COLUMN, INSERT 4, run stopped after the roll: ck.json at the position of row 4, row 4 in no declared part); RED on main 2026-10-29 (the rig oracle: source row 4 not delivered, PostgreSQL and MySQL)"
    scope: source
    patch: cdc-roll-checkpoints-its-trigger/shared.patch
    engines:
      postgres:
        cells: [pg_cdc_a_stop_after_the_column_added_roll_resumes_at_the_row_that_carried_it, "lib:a_roll_for_an_added_column_never_checkpoints_the_event_that_caused_it"]
      mysql:
        cells: [mysql_cdc_a_stop_after_the_column_added_roll_resumes_at_the_row_that_carried_it, "lib:a_roll_for_an_added_column_never_checkpoints_the_event_that_caused_it"]
      mssql:
        na: "a capture instance never carries a column added after it was created, so a run open over one stops by code and never rolls for a column (mssql_cdc_a_column_added_while_a_run_is_open_stops_by_code)"
      mongo:
        na: "a MongoDB change lands the whole document in its one `document` column, so the run's schema never lacks a name and no roll for a column occurs (mongo_cdc_a_field_added_while_a_run_is_open_is_in_the_document)"
      oracle:
        na: "Oracle CDC only drains to the SCN current at open and resolves its schema after it, so a run never reads a change written after its schema and never rolls for a column (oracle_cdc_a_change_older_than_an_alter_is_refused_by_code)"

  - name: incremental-plan-replay-answered
    class: "`rivet apply` treats an incremental plan (`mode: incremental`, `keyset_incremental`) as a point-in-time snapshot: a replay after its first exit-0 apply answers \"already applied\", so every row that arrived since is never delivered with exit 0, and the plan is refused past 24 h"
    history: "found 2026-10-16 on PR #616 CI (run 38911927276): the first F3 replay answer keyed on plan_id alone; `incremental_keyset_apply_rotates_run_id_across_repeated_applies` read COUNT(*) source 150, delivered 100; owner decision (PR #616 comment 6219074059): an incremental plan is a reusable description"
    scope: source
    patch: incremental-plan-replay-answered/shared.patch
    engines:
      postgres:
        cells:
          - a_replayed_first_incremental_plan_delivers_what_arrived_since_postgres
          - a_replayed_keyset_incremental_plan_delivers_what_arrived_since_postgres
          - a_replayed_incremental_plan_delivers_what_arrived_since_postgres
          - incremental_keyset_apply_rotates_run_id_across_repeated_applies
          - "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"
      mysql:
        cells:
          - a_replayed_first_incremental_plan_delivers_what_arrived_since_mysql
          - a_replayed_keyset_incremental_plan_delivers_what_arrived_since_mysql
          - a_replayed_incremental_plan_delivers_what_arrived_since_mysql
          - "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"
      mssql:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_mssql, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      oracle:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_oracle, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      mongo:
        cells: ["lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]

  - name: own-apply-cursor-read-as-drift
    class: "`rivet apply` of an incremental plan made after a cursor was stored is refused RIVET_PLAN_ARTIFACT_STALE (exit 5, \"cursor has drifted\") on every apply after its first, because PA4 reads the cursor the plan's own earlier apply moved as drift"
    history: "retry matrix F3, 2026-10-16: measured on main 04c4a712 (PostgreSQL, GCS): the second apply of one incremental plan exit 5 \"cursor has drifted\"; owner decision (PR #616 comment 6219074059): a cursor moved by an earlier apply of the same plan is not drift"
    scope: source
    patch: own-apply-cursor-read-as-drift/shared.patch
    engines:
      postgres:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_postgres, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      mysql:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_mysql, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      mssql:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_mssql, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      oracle:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_oracle, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      mongo:
        na: "a MongoDB plan holds no cursor snapshot (keyset `resume` continues the stored key), so PA4 never runs for it"

  - name: applied-plan-replayed
    class: "`rivet apply` of a full, chunked or keyset plan whose apply already exited 0 runs it again: a scheduler retry extracts the whole table a second time"
    history: "retry matrix F3, 2026-10-16: a scheduler retry after the task process died right after a successful apply replayed the same artifact; measured on main 04c4a712 (PostgreSQL, GCS): the retry rc 0 with a second run"
    scope: source
    patch: applied-plan-replayed/shared.patch
    engines:
      postgres:
        cells: [a_replayed_applied_full_plan_answers_with_its_run_postgres, a_replayed_applied_keyset_plan_answers_with_its_run_postgres, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mysql:
        cells: [a_replayed_applied_full_plan_answers_with_its_run_mysql, a_replayed_applied_keyset_plan_answers_with_its_run_mysql, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mssql:
        cells: [a_replayed_applied_full_plan_answers_with_its_run_mssql, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      oracle:
        cells: [a_replayed_applied_full_plan_answers_with_its_run_oracle, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mongo:
        cells: ["lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]

  - name: already-applied-answer-text-only
    class: "`rivet apply` of a full, chunked or keyset plan that already applied answers only in prose on stderr: `--summary-output` writes no file and `--json` prints no document, so a scheduler reads the replay as a success with no result"
    history: "found by the Airflow provider after #616, 2026-10-17, verified on main 74cb6daa: the replay path returned before any summary (`eprintln!` of the report, exit 0), and `rivet apply` had no `--summary-output` / `--json` at all; fixed by one builder (`apply_document`) writing the same document for a run and for the answering run, with `status: already_applied` and `answered_by_run`"
    scope: source
    patch: already-applied-answer-text-only/shared.patch
    engines:
      postgres:
        cells: [a_replayed_applied_plan_answers_in_its_summary_document_postgres, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mysql:
        cells: [a_replayed_applied_plan_answers_in_its_summary_document_mysql, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mssql:
        cells: [a_replayed_applied_plan_answers_in_its_summary_document_mssql, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      oracle:
        cells: [a_replayed_applied_plan_answers_in_its_summary_document_oracle, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mongo:
        cells: ["lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]

  - name: checkpointed-chunk-loses-its-class
    class: a coded failure met by one chunk of a checkpointed export (chunk_checkpoint true, one worker or several) ends the run as the incomplete run RIVET_RUN_UNITS_FAILED with exit 1 and a --resume hint instead of the chunk's own code and class, and the --resume meets it again and ends the same way
    history: the second half of worker-error-loses-its-class, found 2026-10-15 fixing it; both checkpoint runners recorded a failed chunk's cause as text in chunk_task and stopped on the not-completed count; a PostgreSQL `infinity` met by a checkpointed chunk exited [RIVET_RUN_UNITS_FAILED] 1 where the same export without chunk_checkpoint exits [RIVET_SOURCE_VALUE_UNREPRESENTABLE] 5, on main through 0.31.0
    scope: source
    patch: checkpointed-chunk-loses-its-class/shared.patch
    engines:
      postgres:
        cells: [a_refusal_in_a_checkpointed_chunk_exits_by_code_and_so_does_its_resume_postgres]
      mysql:
        cells: [a_refusal_in_a_checkpointed_chunk_exits_by_code_and_so_does_its_resume_mysql]
      mssql:
        cells: [a_refusal_in_a_checkpointed_chunk_exits_by_code_and_so_does_its_resume_mssql]
      oracle:
        cells: [a_refusal_in_a_checkpointed_chunk_exits_by_code_and_so_does_its_resume_oracle]
      mongo:
        na: the range-chunk checkpoint runners (chunk_column + chunk_checkpoint) read SQL ranges; MongoDB fans out through mongo_parallel, which drains through FanIn (worker-error-loses-its-class)
      lib:
        cells:
          - "lib:a_coded_chunk_failure_decides_the_runs_exit_under_the_resume_remedy"

  - name: worker-error-loses-its-class
    class: a coded failure in one parallel worker reaches the run as text only (FanIn kept strings), so the run prints RIVET_RUN_UNITS_FAILED and exits 1 or 2 instead of the worker's own code and class
    history: found 2026-10-15 reading FanIn::fail against the owner's "exit follows code class" rule; a PostgreSQL `infinity` met by a parallel keyset worker exited [RIVET_RUN_UNITS_FAILED] 1 where one worker exits [RIVET_SOURCE_VALUE_UNREPRESENTABLE] 5, on main through 0.31.0
    scope: source
    patch: worker-error-loses-its-class/shared.patch
    engines:
      postgres:
        cells: [a_refusal_in_one_worker_exits_as_with_one_worker_postgres]
      mysql:
        cells: [a_refusal_in_one_worker_exits_as_with_one_worker_mysql]
      mssql:
        cells: [a_refusal_in_one_worker_exits_as_with_one_worker_mssql]
      oracle:
        cells: [a_refusal_in_one_worker_exits_as_with_one_worker_oracle]
      mongo:
        cells: [a_coded_failure_in_one_worker_keeps_its_code_mongo]
      lib:
        cells:
          - "lib:a_coded_refusal_in_one_worker_decides_the_runs_exit_and_code"
          - "lib:the_most_stop_worthy_coded_unit_failure_decides"

