          - "lib:the_oracle_schema_stage_refuses_a_wide_decimal_override"
      postgres:
        na: "the PostgreSQL converter raises RIVET_SOURCE_OVERRIDE_WIRE_MISMATCH for any builder or target mismatch at its invariant guard, so no override reaches an internal stop (survey: 0 of 272 runs)"
      mongo:
        na: "a document source has no declared column wire type and takes no columns override"
  - name: oracle-timestamp-ns-undeclared-truncated
    class: an undeclared Oracle TIMESTAMP(7..9) column is delivered at microseconds with a warning and exit 0, so a second client reads a value the source does not hold
    history: "2026-11-05 cluster C5: the sentinel rivet_sent_ts9 failed with SUCCEEDED WITH A CHANGED VALUE; the mapping now carries a refusal that every consumer routes through TypePolicy::validate"
