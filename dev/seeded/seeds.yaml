  - name: sqlite-chunk-claim-takes-no-turn
    class: "the chunk claim on the SQLite state file opens its IMMEDIATE transaction without taking its turn in the in-process write queue, so a sibling store committing back to back wins every gap and the claim is refused `database is locked` after the busy timeout"
