  - name: mssql-ns-override-out-of-range-null
    class: "a SQL Server or Oracle value outside 1677-09-21..2262-04-11 under a `timestamp_ns` / `timestamp_tz_ns` override is written as NULL with exit 0 instead of being refused by code"
    history: "umbrella #852, found 2026-11-06: the SQL Server nanosecond builder wrote NULL when timestamp_nanos_opt() was None; the Oracle builder refused uncoded with exit 1; both now route through types::timestamp_nanos_or_refuse"
    scope: source
    engines:
