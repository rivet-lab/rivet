    class: "a `columns:` override the source reader cannot build (a nanosecond timestamp on MySQL, a value of another wire type on SQL Server, a decimal past precision 38 on SQL Server or Oracle) stops the run as RIVET_INTERNAL_TYPE_BUILDER exit 6, which the gate reads as a rivet bug, instead of the coded usage refusal RIVET_SOURCE_OVERRIDE_WIRE_MISMATCH exit 1"
    history: "2026-11-08 gate d6581394: the MySQL cell a_first_cdc_run_refused_after_its_anchor_releases_it_mysql graded exit 6 as the expected refusal and the run-integrity invariant failed on RIVET_INTERNAL_; 20 of 160 MySQL and 169 of 272 SQL Server override-by-column runs stopped that way on main"
    scope: source
    engines:
