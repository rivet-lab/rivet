      postgres:
        na: "the logical stream carries decoded changes and no statement text the reader lexes (a TRUNCATE is its own message), so this path is never reached"
      mssql:
        na: "the log is a change table, not statements: this path is never reached"
      oracle:
        na: "LogMiner rows are decoded changes, not statement text this reader lexes: this path is never reached"
      mongo:
        na: "the change stream carries no statement text: this path is never reached"

