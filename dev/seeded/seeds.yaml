        cells: ["lib:a_source_path_with_a_uri_character_is_read_as_the_file_it_names", "lib:a_missing_source_is_refused_and_not_created", "lib:an_attached_source_with_no_state_is_refused_by_code"]
      postgres-state:
        na: "`rivet state copy` reads a SQLite file and writes a PostgreSQL state; the path is the SQLite source's, a PostgreSQL state URL is never a `file:` URI"

