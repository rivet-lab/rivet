[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa timing side channel, no upstream fix; reached only by GCS service-account JWT signing via opendal/reqsign, a batch CLI with a handful of signatures (review 2027-02-04)" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc-macro under parquet, no runtime code ships (review 2027-02-04)" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained via serde_yaml_ng; parses operator-written config only, parser swap tracked in #724 (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic duplicate-attribute check; reqsign pins 0.37 and opendal 0.38, fix needs >= 0.41, DoS-class from an operator-configured endpoint (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml unbounded namespace-declaration allocation; same pins as RUSTSEC-2026-0194 (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0391", reason = "zstd stream context reuse leak; fresh Decoder per payload on the MySQL binlog path, fix needs zstd 0.14 which mysql_common 0.37 and parquet 59 block, #724 (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0395", reason = "zstd-safe StableInBuffer on CCtx; experimental feature off, encoder only (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0396", reason = "zstd-safe Seekable reads; seekable feature off (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0397", reason = "zstd-safe OutBuffer::around_pos; the decoder uses OutBuffer::around (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe Seekable::decompress; seekable feature off (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0399", reason = "zstd-safe init_using_cdict/ddict; no dictionaries used (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0400", reason = "zstd-safe dictionary after a one-shot call; no dictionaries used (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0401", reason = "zstd-safe train_from_buffer; zdict training is not called (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0402", reason = "zstd-safe CCtx::try_clone; encoder only, experimental feature off (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe uninitialised memory on a failed legacy-frame decode; bulk API unaffected (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0404", reason = "zstd-safe DCtx::try_clone; not called (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0405", reason = "zstd-safe InBuffer::pos out of range; the decoder uses InBuffer::around (review 2027-02-04)" },
    { id = "RUSTSEC-2026-0406", reason = "zstd-safe multithreaded CCtx with an unfinished frame; zstdmt off, encoder only (review 2027-02-04)" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "UPL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

