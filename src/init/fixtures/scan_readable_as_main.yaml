# Generated by rivet init — db
# Review and adjust before running: rivet check -c <this file>

source:
  type: postgres
  url_env: DATABASE_URL  # export DATABASE_URL='<your-url>' before running

# One export per table/view — review modes and destinations before running.
exports:
  - name: a_orders
    table: a_orders
    # auto: ~5.0M rows ≥ 100K threshold and chunk column 'id' is available
    mode: chunked
    chunk_by_key: id  # keyset (seek) — pages by ROWS, immune to sparse/huge/gappy keys
    chunk_size: 250000
    chunk_checkpoint: true  # crash-recovery: a crashed run resumes from the last committed key on
    # the next run (a clean re-run still does a full pass — never skips rows)
    # keyset_incremental: true # append-only ONLY — a clean re-run pulls just NEW keys (skips
    # already-exported). Silently misses updates on a mutable table; use `mode: incremental` there
    # keyset is sequential; for a DENSE key where you want parallel workers, use `chunk_column:
    # <key>` + `chunk_size` instead
    format: parquet
    parquet:
      row_group_strategy: auto
      target_row_group_mb: 128
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: local
      # rivet also writes manifest.json + _SUCCESS here (its metadata)
      path: ./output/a_orders/
  - name: b_events
    table: b_events
    # auto: ~150K rows ≥ 100K threshold and chunk column 'id' is available
    mode: chunked
    chunk_by_key: id  # keyset (seek) — pages by ROWS, immune to sparse/huge/gappy keys
    chunk_size: 100000
    chunk_checkpoint: true  # crash-recovery: a crashed run resumes from the last committed key on
    # the next run (a clean re-run still does a full pass — never skips rows)
    # keyset_incremental: true # append-only ONLY — a clean re-run pulls just NEW keys (skips
    # already-exported). Silently misses updates on a mutable table; use `mode: incremental` there
    # keyset is sequential; for a DENSE key where you want parallel workers, use `chunk_column:
    # <key>` + `chunk_size` instead
    format: parquet
    parquet:
      row_group_strategy: auto
      target_row_group_mb: 128
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: local
      # rivet also writes manifest.json + _SUCCESS here (its metadata)
      path: ./output/b_events/
  - name: c_small
    table: c_small
    # auto: ~100 rows below 100K chunked threshold
    mode: full
    format: parquet
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: local
      # rivet also writes manifest.json + _SUCCESS here (its metadata)
      path: ./output/c_small/
  - name: d_wide
    table: d_wide
    # auto: ~150K rows ≥ 100K threshold and chunk column 'shard' is available
    mode: chunked
    chunk_by_key: sku  # keyset (seek) — pages by ROWS, immune to sparse/huge/gappy keys
    chunk_size: 100000
    chunk_checkpoint: true  # crash-recovery: a crashed run resumes from the last committed key on
    # the next run (a clean re-run still does a full pass — never skips rows)
    # keyset_incremental: true # append-only ONLY — a clean re-run pulls just NEW keys (skips
    # already-exported). Silently misses updates on a mutable table; use `mode: incremental` there
    # keyset is sequential; for a DENSE key where you want parallel workers, use `chunk_column:
    # <key>` + `chunk_size` instead
    format: parquet
    parquet:
      row_group_strategy: auto
      target_row_group_mb: 128
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: local
      # rivet also writes manifest.json + _SUCCESS here (its metadata)
      path: ./output/d_wide/
  - name: y_locked_small
    table: y_locked_small
    # auto: ~100 rows below 100K chunked threshold
    mode: full
    format: parquet
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: local
      # rivet also writes manifest.json + _SUCCESS here (its metadata)
      path: ./output/y_locked_small/
