schema: [id, owner, reads, scope, also_in, bypass, exceptions]
seams:
  - id: manifest-census
    owner: src/manifest/census.rs::ManifestCensus
    reads: "the run manifests under one prefix: which runs live there, their family, split units, supersession and claimed parts"
    also_in: [src/manifest.rs]
    bypass:
      - "is_run_unique_manifest_name ("
      - "read_unit_manifests ("
    exceptions:
      - {at: src/load/reconcile.rs::is_run_unique_manifest, dated: 2026-10-31, reason: "name wrapper feeding is_manifest_key for the GCS lister", closes: "ManifestCensus owns the name test; call it from fetch_manifests_keyed"}
      - {at: src/pipeline/manifest_reconcile.rs::reconcile_manifest_against_listing, dated: 2026-10-31, reason: "name filter of the untracked-object scan, not a manifest read", closes: "ManifestCensus exposes the run-unique name test"}
  - id: run-set
    owner: src/config/cdc.rs::declared_exports
    reads: "the exports one invocation runs: one named export, or the whole config minus the CDC backfill recipes"
    scope: [src/pipeline/, src/cli/, src/preflight/, src/load/, src/plan/]
    also_in: [src/pipeline/run_set.rs]
    bypass:
      - "backfill_recipe_names ("
      - "exports . iter ( ) . filter ( | e | e . name == name )"
      - ". find ( | e | e . name == name )"
      - ". find ( | e | e . name == export_name )"
      - "None => config . exports . iter ( ) . collect ( )"
      - "for export in & config . exports"
    exceptions: []
  - id: url-authority
    owner: src/url_text.rs::host_port_span
    reads: "the userinfo and the host span of a connection URL"
    bypass:
      - "'@'"
      - "find_userinfo ("
      - "userinfo_span ("
    exceptions: []
  - id: object-store-retry
    owner: src/destination/cloud.rs::new_with_retries
    reads: "the retry policy every object-store operator is wrapped in"
    bypass:
      - "RetryLayer :: new ("
    exceptions:
      - {at: src/destination/gcs.rs::wrap, dated: 2026-10-31, reason: "second RetryLayer with max_times 3, duplication only", closes: "route through new_with_retries after the gate"}
  - id: cdc-captured-tables
    owner: src/config/cdc.rs::cdc_captured_tables
    reads: "the tables one mode cdc export captures, folding table and tables"
    bypass:
      - "& export . tables , & export . table )"
      - ". table . iter ( ) . chain ("
    exceptions:
      - {at: src/pipeline/cdc_job.rs::initial_snapshot_pending, dated: 2026-10-31, reason: "copy of the table and tables fold plus a multi flag, not reachable", closes: "cdc_captured_tables returns the multi flag after the gate"}
      - {at: src/pipeline/cdc_job.rs::resolve_grants, dated: 2026-10-31, reason: "copy of the table and tables fold, not reachable", closes: "call cdc_captured_tables after the gate"}
      - {at: src/pipeline/cdc_job.rs::run_cdc_inner, dated: 2026-10-31, reason: "copy of the table and tables fold plus a multi flag, not reachable", closes: "cdc_captured_tables returns the multi flag after the gate"}
      - {at: src/preflight/cdc_health.rs::oracle_checks, dated: 2026-10-31, reason: "copy of the table and tables fold, not reachable", closes: "call cdc_captured_tables after the gate"}
      - {at: src/preflight/cdc_health.rs::run_refusals, dated: 2026-10-31, reason: "copy of the table and tables fold, not reachable", closes: "call cdc_captured_tables after the gate"}
  - id: config-knob-quantity
    owner: src/config/quantity.rs::Knob
    reads: "a numeric config knob or CLI flag: its range, what 0 means, and the bytes, rows, key span or ratio the runtime uses"
    bypass:
      - "chunk_size as i64"
      - "effective_chunk_size as i64"
      - "( max_val - min_val )"
      - "checked_sub ( min_i )"
      - "rollover : a . rollover"
      - "page . max ( 1 )"
    exceptions: []
  - id: keyset-key-type
    owner: src/source/keyset_key.rs::keyset_key_refusal
    reads: "which delivered column types a keyset seek can key: the cursor must read the last value and re-bind it as a literal that orders as the stored value"
    also_in: [src/source/mod.rs]
    bypass:
      - ". keyset_keys . push ("
      - ". keyset_keys . retain ("
      - ". keyset_keys . extend ("
    exceptions: []
