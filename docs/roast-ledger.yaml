    closes: "the residual busy is named: the forced-order cells a_replan_beside_a_writer_that_never_lets_go_gets_its_turn and a_replan_beside_a_writer_slower_than_the_turn_patience_gets_its_turn (src/state/checkpoint.rs:949, :995; #638, #663) already hold the writer across the replan and pass, so the sighting needs a holder they do not model (a failure log that names the holder, or a stall past the busy timeout on a loaded runner); until then the 1000-try cell stays the only cover of it"
