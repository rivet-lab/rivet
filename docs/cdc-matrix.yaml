
engines: [postgres, mysql, mssql, mongo, oracle]

scenarios:
  - id: cdc_initial_snapshot_then_stream
    what: "initial: snapshot covers pre-existing rows, then streams live changes"
    postgres: { test: pg_cdc_initial_snapshot_covers_preexisting_rows_then_streams }
    mysql:    { test: cdc_initial_snapshot_covers_preexisting_rows_then_streams }
    mssql:    { test: mssql_cdc_initial_snapshot_covers_preexisting_rows_then_streams }
    mongo:    { test: mongo_cdc_initial_snapshot_covers_preexisting_rows }
    oracle:   { test: oracle_cdc_initial_snapshot_covers_preexisting_rows }

  - id: cdc_insert_capture
    what: "an INSERT is captured (op sequence / after-image)"
    postgres: { test: streams_insert_update_delete }
    mysql:    { test: streams_typed_insert_update_delete }
    mssql:    { test: streams_change_operations }
    mongo:    { test: mongo_cdc_capture_resume_and_until_current_drain }
    oracle:   { test: oracle_cdc_resume_captures_only_new_changes }

  - id: cdc_update_capture
    what: "an UPDATE is captured with the full after-image (and before, where relevant)"
    postgres: { test: pg_cdc_update_and_delete_carry_full_types }
    mysql:    { test: cdc_update_and_delete_carry_full_types }
    mssql:    { test: mssql_cdc_update_and_delete_carry_full_types }
    mongo:    { test: mongo_cdc_update_and_delete_carry_document }
    oracle:   { test: oracle_cdc_update_and_delete_carry_full_types }

  - id: cdc_delete_capture
    what: "a DELETE is captured with its before-image (not an empty after)"
    postgres: { test: pg_cdc_update_and_delete_carry_full_types }
    mysql:    { test: cdc_update_and_delete_carry_full_types }
    mssql:    { test: mssql_cdc_update_and_delete_carry_full_types }
    mongo:    { test: mongo_cdc_update_and_delete_carry_document }
    oracle:   { test: oracle_cdc_update_and_delete_carry_full_types }

  - id: cdc_resume_only_new_changes
    what: "resume from the per-engine anchor (slot advance / binlog ckpt / from-LSN / resume token) — 2nd run captures ONLY new changes"
    postgres: { test: pg_cdc_resume_captures_only_new_changes }
    mysql:    { test: cdc_resume_captures_only_new_changes }
    mssql:    { test: mssql_cdc_resume_captures_only_new_changes }
    mongo:    { test: mongo_cdc_capture_resume_and_until_current_drain }
    oracle:   { test: oracle_cdc_resume_captures_only_new_changes }

  - id: cdc_resume_idle_first_run
    what: "idle first run captures 0 → change → next run captures it (no re-anchor to current)"
    postgres: { test: pg_cdc_idle_first_run_then_change_is_captured_not_skipped }
    mysql:    { test: cdc_idle_first_run_then_change_is_captured_not_skipped }
    mssql:    { test: mssql_cdc_idle_first_run_then_change_is_captured_not_skipped }
    mongo:    { test: mongo_cdc_idle_first_run_then_change_is_captured }
    oracle:   { test: oracle_cdc_idle_first_run_then_change_is_captured }

  - id: cdc_log_gone_before_first_changes_run
    what: "a baseline, then the log loses changes before the first changes run (retention cleanup, a re-created capture instance, a dropped slot): the run refuses, twice, and the printed re-baseline remedy ends with destination = source. The same loss after one changes run is fail-loud-matrix `cdc_vanished_anchor_loud`. MySQL and Oracle forge the position instead of purging the server's log (a real purge is server-global and would break concurrent cells); PostgreSQL and MySQL refuse with exit 1 and no RIVET_ code."
    postgres: { test: pg_missing_slot_refusal_remedy_recovers_the_row_written_while_the_slot_was_gone }
    mysql:    { test: cdc_resume_from_missing_binlog_fails_loudly_not_silently }
    mssql:    { test: mssql_cleanup_past_unread_changes_before_the_first_changes_run_is_refused }
    mongo:    { test: an_oplog_rolled_past_the_checkpoint_before_the_first_changes_run_is_refused_by_code_mongo }
    oracle:   { test: oracle_cdc_resume_past_log_retention_fails_loudly }

  - id: cdc_crash_at_least_once
    what: "crash before checkpoint/ack (cdc_after_flush_before_ack hook) → re-read on resume, never lose"
    postgres: { test: pg_cdc_crash_after_flush_before_ack_does_not_advance_the_slot }
    mysql:    { test: cdc_crash_after_flush_before_ack_re_reads_on_resume }
    mssql:    { test: mssql_cdc_crash_before_checkpoint_re_reads_on_resume }
    mongo:    { test: mongo_cdc_crash_after_flush_before_ack_re_reads_on_resume }
    oracle:   { test: oracle_cdc_crash_after_flush_before_ack }

  - id: cdc_schema_drift
    what: "a column added / renamed mid-stream is handled (re-resolve schema, map by name)"
    postgres: { test: pg_cdc_column_added_mid_stream_is_captured }
    mysql:    { test: cdc_picks_up_a_column_added_between_runs }
    mssql:    { test: mssql_cdc_column_added_via_new_capture_instance_is_captured }
    mongo:    { na: "schemaless — a new field rides the verbatim document blob; no fixed per-collection schema to drift" }
    oracle:   { test: oracle_cdc_picks_up_a_column_added_between_runs }

  - id: cdc_stop_after_column_roll
    what: "a run stopped right after the roll a column added while it is open forces resumes at the commit before the change that caused it: that change is delivered, not acknowledged unwritten"
    postgres: { test: pg_cdc_a_stop_after_the_column_added_roll_resumes_at_the_row_that_carried_it }
    mysql:    { test: mysql_cdc_a_stop_after_the_column_added_roll_resumes_at_the_row_that_carried_it }
    mssql:    { na: "a capture instance never carries a column added after it was created, so a run open over one stops by code instead of rolling (mssql_cdc_a_column_added_while_a_run_is_open_stops_by_code)" }
    mongo:    { na: "schemaless — a field added while the run is open is a value in the document column; the run's schema never lacks a name, so no roll for a column occurs" }
    oracle:   { na: "a run drains only to the SCN current at open and resolves its schema after it, so it never reads a change written after its schema; an ADD COLUMN inside the window is refused before any write (oracle_cdc_a_change_older_than_an_alter_is_refused_by_code)" }

  - id: cdc_whole_db_multiplex
    what: "one stream over many tables/collections, one anchor, resumes"
    postgres: { test: pg_cdc_multi_table_stream_uses_one_slot_and_resumes }
    mysql:    { test: cdc_multi_table_stream_one_binlog_connection_and_resumes }
    mssql:    { na: "MSSQL CDC is one capture instance per stream; config validation rejects `tables:` — mixed-txn routing covered by mssql_cdc_mixed_transaction_and_qualified_table_conformance" }
    mongo:    { na: "db.watch() is inherently a single whole-database stream; multi-collection routing is structural (mongo_cdc_mixed_transaction_ending_on_uncaptured_table)" }
    oracle:   { test: oracle_cdc_two_tables_share_one_window_and_resume }

  - id: cdc_seq_total_order
    what: "__seq gives a total change order (shared commit position + intra-txn tiebreak) for correct current-state dedup"
    postgres: { test: pg_cdc_intra_transaction_updates_get_distinct_seq }
    mysql:    { test: cdc_intra_transaction_updates_get_distinct_seq }
    mssql:    { test: mssql_cdc_intra_transaction_updates_get_distinct_seq }
    mongo:    { na: "every change-stream event carries a distinct order-preserving resume token, so __seq is always 0; total order is __pos alone (mongo_cdc_soak_dedup_matches_source_current_state)" }
    oracle:   { test: oracle_cdc_intra_transaction_updates_get_distinct_seq }

  - id: cdc_until_current_bounded
    what: "until_current: true — a bounded run TERMINATES at the open-time bound (position current when the stream opened), even under sustained concurrent writes"
    postgres: { test: pg_cdc_until_current_terminates_under_sustained_writes }
    mysql:    { test: cdc_until_current_terminates_under_sustained_writes }
    mssql:    { test: mssql_cdc_until_current_terminates_under_sustained_writes }
    mongo:    { test: roast_until_current_terminates_under_sustained_writes_and_keeps_backlog }
    oracle:   { test: roast_oracle_cdc_until_current_open_bound_two_runs_lose_nothing }

  - id: cdc_until_current_sharded_reads_every_write_before_the_run
    what: "until_current: true on a sharded source — a run delivers every write committed before it started, even when one shard is idle and another lags; chunks moving and runs killed change no row of the destination"
    postgres: { na: "a PostgreSQL source is one instance with one WAL; there is no second shard whose log can lag behind the position the first one reports" }
    mysql:    { na: "a MySQL source is one binlog stream per server; the replication position is a single total order, so no shard can lag behind it" }
    mssql:    { na: "a SQL Server source is one transaction log; its LSN order is total, so no second log can trail the position the first one reports" }
    mongo:    { test: a_sharded_mongo_run_delivers_every_write_committed_before_it_started, note: "mongos merges the change streams of two shards; the end-to-end cell is a_sharded_mongo_stream_with_chunks_moving_and_runs_killed_loads_into_clickhouse_as_the_source" }
    oracle:   { na: "an Oracle source is one redo stream per instance read through LogMiner; a single SCN order covers it, so no second stream can trail the position" }

  - id: cdc_until_current_open_bound_two_runs
    what: "DEFER-NOT-DROP: a writer commits through run 1, which terminates and captures a prefix; run 2 drains the tail; the distinct-id union re-read from the parquet equals the SOURCE id set. Termination is load-bearing on the open-time bound for PostgreSQL (continuous slot re-peek — the PG variant runs rollover: 5, the RED shape that hung the pre-bound code) AND MongoDB (a tailable change stream that never empty-polls under sustained writes — the cluster-time bound stops it; disabling the pin hangs the sustained-writes test); MySQL (NON_BLOCK EOF) and SQL Server (Agent scan-gap empty poll) terminate natively, so their bound is a precise-stop refinement and their test proves defer-not-drop (each verified fix-invariant for termination by a disable-bound probe)"
    postgres: { test: roast_pg_until_current_open_bound_two_runs_lose_nothing }
    mysql:    { test: roast_mysql_until_current_open_bound_two_runs_lose_nothing }
    mssql:    { test: roast_mssql_until_current_open_bound_two_runs_lose_nothing }
    mongo:    { test: roast_mongo_cdc_until_current_open_bound_two_runs_lose_nothing }
    oracle:   { test: roast_oracle_cdc_until_current_open_bound_two_runs_lose_nothing }

  - id: cdc_ndjson_bounded
    what: "the NDJSON driver (rivet cdc without --output) under until_current: terminates at the open-time bound under a live writer and emits the whole pre-open backlog to stdout (no ack by design — stdout is not durable, ADR-0023)"
    postgres: { test: roast_pg_cdc_ndjson_until_current_terminates_and_emits_backlog }
    mysql:    { na: "one engine-independent driver loop (cdc::run) — anchored once on PostgreSQL, the engine whose Unbounded peek and open-time bound interact" }
    mssql:    { na: "same driver loop — anchored once on PostgreSQL" }
    mongo:    { na: "same driver loop — anchored once on PostgreSQL" }
    oracle:   { na: "same driver loop (Oracle is always a bounded drain; `--stream` is refused) — anchored once on PostgreSQL; Oracle's NDJSON path runs in oracle_cdc_cli_resolves_the_source_from_env_and_file_alike" }

  - id: cdc_empty_transaction_churn
    what: "row-less transactions (DDL churn decodes as empty BEGIN/COMMIT) must not pin the replication anchor: a zero-yield run releases the data-free span"
    postgres: { test: roast_pg_cdc_empty_transaction_churn_must_not_pin_the_slot }
    mysql:    { na: "no consume-retention coupling — the binlog purges on the server's schedule regardless of reader position; an unread empty span costs nothing" }
    mssql:    { na: "no consume-retention coupling — change-table retention is the cleanup job's, independent of the reader" }
    mongo:    { na: "no consume-retention coupling — the oplog is a capped collection, trimmed regardless of resume tokens" }
    oracle:   { na: "no consume-retention coupling — archived redo is purged on the DBA's own retention regardless of rivet's SCNs (ADR-0037 OR11); an unread empty span pins nothing" }

  - id: cdc_bounded_reaches_open_bound_past_foreign_span
    what: "a bounded run reaches the open-time bound in ONE pass even when a large UNCAPTURED-table transaction sits ahead of the captured data — the sink re-drain loop acks the consumed span so the peek slides past it (the density-below-1/3 gap: an uncaptured/empty span has an unbounded wire:capture ratio, so no fixed peek budget covers it)"
    postgres: { test: roast_pg_cdc_reaches_open_bound_past_a_large_uncaptured_transaction }
    mysql:    { na: "the binlog stream advances its own read cursor regardless of routing, so an uncaptured span never re-reads or starves the reader — no slot-style consume coupling" }
    mssql:    { na: "the change-table poll advances its own from-LSN cursor per batch, independent of what the sink captures — no re-read starvation" }
    mongo:    { na: "the change stream advances its own resume token regardless of routing — no re-read starvation" }
    oracle:   { na: "no peek budget to starve — each run mines [low_water, SCN at open] in one LogMiner query with the captured tables filtered server-side (SEG_OWNER/TABLE_NAME); the uncaptured-table leg is oracle_cdc_mixed_transaction_ending_on_uncaptured_table" }

  - id: cdc_large_transaction_atomic_across_crash
    what: "a source transaction LARGER than rollover rolls + checkpoints as ONE unit (never split across parts): a crash mid-flush must not advance the resume position past the transaction and lose its tail — the adapter marks only the LAST event of a transaction committed, so the sink rolls only at the true commit boundary"
    postgres: { test: roast_pg_cdc_large_transaction_is_atomic_across_a_mid_flush_crash }
    mysql:    { test: roast_mysql_cdc_large_transaction_is_atomic_across_a_mid_flush_crash }
    mssql:    { test: roast_mssql_cdc_large_transaction_is_atomic_across_a_mid_flush_crash }
    mongo:    { na: "each change-stream event carries its OWN unique resume token (cse.id) — even within a multi-document transaction (Mongo 4.0+) — so a mid-transaction roll checkpoints event K's token and resume continues at K+1, never skipping a tail. Unlike PG (all events of a transaction share the commit LSN) and MSSQL (all rows share __$start_lsn), there is no shared position to skip, so no last-of-transaction marking is needed" }
    oracle:   { test: roast_oracle_cdc_large_transaction_is_atomic_across_a_mid_flush_crash }

  - id: cdc_type_fidelity
    what: "values captured through CDC match the batch export (timestamps/decimals/uuid/json)"
    postgres: { test: postgres_batch_and_cdc_deliver_every_ledger_row_alike }
    mysql:    { test: mysql_batch_and_cdc_deliver_every_ledger_row_alike }
    mssql:    { test: mssql_batch_and_cdc_deliver_every_ledger_row_alike }
    mongo:    { na: "CDC and batch share the identical document_to_json serializer, so no per-op typing can diverge them — pinned once on the batch side (mongo_batch_type_fidelity_document_is_verbatim_extjson)" }
    oracle:   { test: oracle_batch_and_cdc_deliver_every_ledger_row_alike }

  - id: cdc_silent_update_captured
    what: "the CDC value prop: a column update that does NOT bump updated_at (the change a watermark / incremental `WHERE updated_at > last_seen` sync MISSES) is captured with its NEW after-image. Oracle: the source row's unchanged updated_at (proves the miss) + the parquet (proves the capture)"
    postgres: { test: roast_pg_cdc_captures_a_silent_update_a_watermark_sync_would_miss }
    mysql:    { na: "the same log-derived after-image — the binlog records the row change regardless of which columns moved; the update-capture + type-fidelity cells prove the after-image, this cell pins the watermark-miss framing once on PG" }
    mssql:    { na: "same — the change table records the row change independent of updated_at; proven per-engine by update-capture, framed once on PG" }
    mongo:    { na: "same — the change stream's full_document is the whole post-image regardless of which fields changed; framed once on PG" }
    oracle:   { na: "same — LogMiner redo records the row change regardless of which columns moved; the after-image is proven by oracle_cdc_update_and_delete_carry_full_types, framed once on PG" }

  - id: cdc_primary_key_change
    what: "an UPDATE that changes the key (the declared `load.pk`, else the table's primary key) is written as a delete of the old key then an insert of the new row, at one `__pos` with the insert's `__seq` after the delete's (ADR-0030), so a latest-image-per-key merge holds only the new key. Oracle also renumbers keys in one statement (`id = id + 1`, logged 1->2 before 2->3) without losing a row whose images differ"
    postgres: { test: pg_cdc_pk_changing_update_captures_and_does_not_brick, note: "the key is not the leading column, so an old key laid out under the wrong names goes RED; the ClickHouse cycle a_postgres_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source flags the old key in the view, and the BigQuery base+buffer cycle a_key_move_leaves_one_live_row_per_key_in_a_partitioned_base_postgres leaves one live row per key. An old image that does not carry every key column never splits (pg_cdc_an_update_of_a_replica_identity_index_that_is_not_the_key_stays_one_update, pg_cdc_a_declared_key_absent_from_the_old_key_does_not_split); a table whose changes carry no old image is warned about at open (pg_cdc_warns_about_a_table_whose_changes_carry_no_old_image)" }
    mysql:    { test: mysql_cdc_a_composite_key_move_is_a_delete_then_an_insert, note: "a composite key read from the catalog; a value change beside it stays an update. The ClickHouse cycle a_mysql_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source flags the old key in the view; the BigQuery base+buffer cycle a_key_move_leaves_one_live_row_per_key_in_a_partitioned_base_mysql leaves one live row per key" }
    mssql:    { test: a_sql_server_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source, note: "the change table itself records a key update as a delete and an insert; the cycle flags the old key in the view" }
    mongo:    { na: "_id is immutable, so a key change cannot be expressed" }
    oracle:   { test: oracle_cdc_a_primary_key_update_is_a_delete_then_an_insert, note: "rows that differ only in the key are told apart by the LogMiner ROWID (oracle_cdc_a_renumber_over_rows_with_equal_images_keeps_every_row); an index-organized or row-movement table has no stable ROWID and keeps the image rule (ADR-0030; a_renumber_over_equal_images_without_a_row_id_documents_the_lost_row); a row wider than 255 columns keeps its ROWID (oracle_cdc_a_key_move_of_a_row_wider_than_255_columns_is_captured_not_refused)" }

  - id: cdc_bounded_on_standby_fails_loud
    what: "bounded until_current CDC on a PostgreSQL STANDBY (in recovery) must fail LOUD with an actionable message — pg_current_wal_lsn() is unavailable and a logical slot cannot be created in recovery; the adapter checks pg_is_in_recovery() up front and names the escape (stream continuously / point at the primary). Requires the opt-in cdc-standby compose profile (python3 -m dev.pytools.cdc_stand standby)"
    postgres: { test: roast_pg_cdc_bounded_on_a_standby_fails_loud }
    mysql:    { na: "MySQL replicas are not 'in recovery' in this sense — a replica has its own binlog and SHOW MASTER STATUS works; reading CDC from a MySQL replica is a supported topology, not a fail-loud case" }
    mssql:    { na: "SQL Server CDC reads change tables, which exist on the primary; an Always On secondary is read-only but CDC capture is a primary concern — no analogous recovery-mode fail" }
    mongo:    { na: "a MongoDB secondary serves change streams fine (they read the oplog); reading CDC from a secondary is a supported topology, not a fail-loud case" }
    oracle:   { gap: "cannot run on this stand: needs an Oracle Data Guard standby, which is an Enterprise Edition feature the stand's Oracle Database Free image does not include (a licence, not a harness leg; measured 2026-10-08 on the stand: v$option reports `Oracle Data Guard = FALSE` and `Managed Standby = FALSE`). Whether a bounded drain pointed at a standby fails loud or mines is unknown" }

  - id: cdc_failover_to_another_member
    what: "a failover: the member rivet reads from fails and the SAME config is pointed at another member of the cluster. Nothing may be lost or duplicated silently: rivet either refuses loudly (no part, checkpoint unmoved) or continues with every change exactly once. A cell that does neither is a strict known defect, so the gate flips the day it is fixed"
    postgres: { test: a_pg_failover_to_the_standby_with_a_checkpoint_is_refused_not_resumed_on_a_new_slot, note: "with `cdc.checkpoint` the missing slot is refused. Two strict known defects: without a checkpoint a new slot is created with only a warning and the rows written during the switch are lost (a_pg_failover_to_the_standby_without_a_checkpoint_loses_the_rows_written_during_the_switch, graded by the rig oracle as undelivered rows); following the failover is not implemented (pg_cdc_follows_a_failover_to_the_standby)" }
    mysql:    { test: a_failover_to_another_cluster_member_is_refused_not_resumed_at_foreign_coordinates, note: "refused by server identity (server_uuid, then the GTID set); following the failover by GTID is a strict known defect (cdc_follows_a_failover_to_another_cluster_member_by_gtid)" }
    mssql:    { test: mssql_checkpoint_follows_a_failover_to_the_secondary }
    mongo:    { test: mongo_cdc_follows_a_failover_to_another_replica_set_member, note: "the resume token lives in the replica set's shared oplog, so the stream continues on another member; a primary election (stepdown) is not exercised: the stand's second member has priority 0" }
    oracle:   { gap: "cannot run on this stand: needs an Oracle Data Guard standby, which is an Enterprise Edition feature the stand's Oracle Database Free image does not include (a licence, not a harness leg; measured 2026-10-08 on the stand: v$option reports `Oracle Data Guard = FALSE` and `Managed Standby = FALSE`). What a failover does to an Oracle CDC checkpoint is unknown; another database is refused (oracle_cdc_checkpoint_from_another_database_is_refused)" }

  - id: cdc_oversized_transaction_bails_loud
    what: "a transaction is buffered WHOLE (never split across parts), so an oversized one would OOM — each adapter caps its per-transaction buffer (max_tx_rows(), default 5M, and max_tx_bytes(), default 2 GiB of RESIDENT cost — at resident rates the byte cap fires first on any realistic row) and BY DEFAULT bails loudly naming the cap, never a silent OOM or partial capture. With RIVET_CDC_SPILL_DIR set the same threshold spills the tail to disk instead and the run proceeds — the *_past_the_memory_cap_* tests cover that branch; these four cover the refusal, which is why they must run WITHOUT the env var. One shared helper but FOUR call sites — each adapter's own guard is RED-proven, not just the helper"
    postgres: { test: roast_pg_cdc_oversized_transaction_bails_loud_not_oom }
    mysql:    { test: roast_mysql_cdc_oversized_transaction_bails_loud_not_oom }
    mssql:    { test: roast_mssql_cdc_oversized_transaction_bails_loud_not_oom }
    mongo:    { na: "no per-transaction buffering — each change-stream event is one document, flushed independently; there is no whole-transaction buffer to bound" }
    oracle:   { test: oracle_cdc_byte_cap_counts_the_first_row_and_defers_not_drops }

  - id: cdc_rebaseline_remedy_recovers
    what: "a data-loss warning or refusal's re-baseline remedy, followed as printed from the state that printed it, recovers the rows the stream lost and leaves no removed row live in the destination (the default rig oracle grades the remedy run against the source; a truncated row goes out as a change part first). The text is checkpoint_identity::RECOVER, pinned by a hand-written literal; `re-snapshot (mode: full)` was refused for a CDC export and for a batch export into its destination"
    postgres: { test: pg_slot_created_warning_remedy_recovers_the_row_written_while_the_slot_was_gone }
    mysql:    { test: mysql_missing_checkpoint_refusal_remedy_recovers_the_row_written_while_it_was_gone }
    mssql:    { test: mssql_retention_gap_refusal_remedy_recovers_the_rows_the_cleanup_removed }
    mongo:    { test: mongo_missing_checkpoint_refusal_on_a_changes_only_stream_remedy_recovers_the_document_written_while_it_was_gone }
    oracle:   { test: oracle_cdc_truncate_refusal_remedy_leaves_no_removed_row_live_in_the_prefix }

  - id: cdc_lost_file_checkpoint_is_refused_not_reanchored
    what: "a changes-only stream whose checkpoint file is gone while the state DB records that the export wrote it is refused (RIVET_SOURCE_CDC_CHECKPOINT_INVALID, exit 5, nothing read or written, no checkpoint recreated) on every run, naming `rivet state reset -c <config> -e <export>`; the reset lifts it and the next run anchors at the current position. Before, the run anchored at the current position with a warning and exit 0, and the changes between the lost and the new position were never delivered (the rig oracle: source 2, delivered 1). A first run, and a stream under a baseline (refused earlier, by ensure_anchor), are unchanged"
    postgres: { na: "the slot is the anchor on the server; a missing slot is refused by the PriorRun guard (pg_missing_slot_refusal cells)" }
