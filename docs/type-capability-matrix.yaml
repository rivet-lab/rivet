# Type capability ledger (ADR-0038 CP9).
#
# forms:   one entry per `TextForm` variant (src/types/delivery.rs), keyed by its label.
#          renderer: the pure fn in src/types/delivery.rs, or `engine-produced`.
#          recover:  the expression each warehouse runs on the text column `x` to get a
#                    native column back; `text` means the column stays text there.
# engines: every native type of every source engine, one `rows:` list, one row per type:
#          native_type  the column type as written in CREATE TABLE (Mongo: the BSON type)
#          sample       SQL literals; sample i of every row lands in table row i (Mongo:
#                       extended-JSON strings; the row named `_id` holds the id literals)
#          edges        the row's edge values, beside `sample`: a SQL literal, or a mapping
#                       {v: LITERAL, x: VERDICT, cdc: VERDICT, bigquery|snowflake|clickhouse: VERDICT}.
#                       NULL is an implicit edge. A verdict is [NAME!]exact | null | form:TEXT |
#                       refuse:CODE[@extract|load]: the value as is, NULL by design, the canonical
#                       text of what lands, or a coded refusal (CODE may be UNCODED). `x` is the
#                       extract verdict (default exact, stage extract); a target key is the load
#                       verdict there (default stage load). `NAME!` marks a known defect: the cell
#                       is red as DEFECT_NAME and dev/release_oracle/known_red.py excuses it; once
#                       the cell delivers the ideal it is red as DEFECT_GONE_NAME. A value some
#                       verdict refuses is seeded in a table of its own, so it cannot refuse its
#                       neighbours. A literal the harness cannot read needs a `form:` verdict.
#          delivery     the Arrow type (`DataType` display), a canonical extension name
#                       (`arrow.uuid`), or a TextForm label from `forms:` above; always the
#                       ADR target, never a refusal. A row without `delivery` is MATRIX-ONLY:
#                       it needs `edges`, and only the edge matrix grades it (no CDC parity)
#          cdc          a row with `delivery` carries its change-stream verdict: `exact` (CDC delivers what
#                       batch does) or `refuse:CODE` (a registered code) with a dated `cdc_reason`; an edge's own
#                       `cdc:` is a verdict of the grammar above (`form:` only there); a known defect of the CDC
#                       path is the row's known_defect, which the parity test grades against today_delivery
#          refuses      the verdict of the whole column, `refuse:CODE@extract` (the column is
#                       refused by name today); on a row with `delivery` it needs `known_defect`
#          render       optional, `{c}` standing for the column, over the engine's `renders:`
#                       entry for the row's delivery (what the delivery determines; a row
#                       names only what its native type adds); no render may narrow a value:
#                         duck    the DuckDB projection applied alike to every stage DuckDB
#                                 reads (`arrow` for Decimal256, which DuckDB reads as DOUBLE,
#                                 CP11: Arrow's display grades the parts instead; postgres only)
#                         server  source-side SQL read through DuckDB's passthrough, for a
#                                 column the DuckDB scanner would narrow
#                         source  Oracle only (no DuckDB scanner): the client-side rendering
#                         canon   number, timestamp, float32, float64, interval, round_micros
#          known_defect why rivet misses the declared ADR target today and which step fixes
#                       it. It excuses only its declared class: today_delivery (and the
#                       today_clickhouse it drives) and the samples below; every other check
#                       stays strict, and the driver fails once the class passes
#          today_delivery  required beside known_defect: the delivery rivet ships today
#                       (`server_text` on a refuses row). The driver accepts only the
#                       target (then the marker is stale) or this type; any third is a regression
#          today_render optional, beside known_defect: the render that grades what rivet
#                       delivers today at full precision (e.g. microseconds of a ns target)
#          defect_samples  optional, beside known_defect: sample literals (`NULL` for a NULL
#                       cell) whose delivered value differs from the source today
#          clickhouse   the ClickHouse leg (PostgreSQL, MySQL, SQL Server):
#                         type    the column type `rivet load` builds in ClickHouse
#                         today   required beside a marker: the type it builds today (the
#                                 target or this, nothing else)
#                         defect  like known_defect, for the ClickHouse stage alone
#                         defect_samples  like defect_samples, for the ClickHouse stage alone
#          setup:       engine-level DDL run before the table (types the rows name).
#          renders:     engine-level, delivery -> render, merged under every row's own render.
#          dev/release_oracle/type_edges.py reads `edges`, `refuses` and `cdc`;
#          property_no_silent_null.py seeds one column per row from them (the one seed path of
#          every engine) and grades the extract; property_no_silent_null_load.py and
#          cloud_legs.py load the same columns to ClickHouse, BigQuery and Snowflake and read
#          them back independently, DuckDB reading the Parquet.
#          dev/release_oracle/rig_oracle.py reads the delivering rows: render (after renders:)
#          and today_render (server, source, duck, canon), known_defect, defect_samples and
#          clickhouse (type, defect, defect_samples).
#          tests/live/live_cdc_type_parity.rs builds one table per engine from the delivering
#          rows; one DuckDB session grades the source, the batch parts, the CDC snapshot, stream
#          and final image, both state DBs and the ClickHouse view `rivet load` builds
#          (PostgreSQL, MySQL, SQL Server): type, values, COUNT(*), COUNT(col), COUNT(DISTINCT).
#          A delivery short of its ADR target stays declared at the target, marked known_defect.
#
# Guarded by tests/offline/type_capability_matrix_guard.rs.

forms:
  decimal_plain:
    renderer: decimal_plain
    recover:
      bigquery: CAST(x AS BIGNUMERIC)   # rounds past 38 fractional digits
      snowflake: text                   # NUMBER stops at 38 digits
      clickhouse: toDecimal256(x, S)    # no overflow check on arithmetic
      duckdb: text                      # DECIMAL stops at 38 digits
  iso8601_duration:
    renderer: iso8601_duration
    recover:
      bigquery: CAST(x AS INTERVAL)
      snowflake: text
      clickhouse: text
      duckdb: text
  iso_timestamp_nanos:
    renderer: iso_timestamp_nanos
    recover:
      bigquery: text                    # more than 6 fraction digits is an error
      snowflake: CAST(x AS TIMESTAMP_NTZ(9))   # TIMESTAMP_TZ(9) when zoned
      clickhouse: parseDateTime64BestEffort(x, 9)   # holds 1677..2262 only
      duckdb: CAST(x AS TIMESTAMP_NS)
  time_of_day_offset:
    renderer: time_of_day_offset
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text                      # TIMETZ drops the offset
  time_beyond_day:
    renderer: time_beyond_day
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text
  uuid36:
    renderer: uuid36
    recover:
      bigquery: text                    # STRING is BigQuery's UUID
      snowflake: TO_UUID(x)
      clickhouse: toUUID(x)
      duckdb: CAST(x AS UUID)
  json:
    renderer: engine-produced
    recover:
      bigquery: PARSE_JSON(x)
      snowflake: PARSE_JSON(x)
      clickhouse: CAST(x AS JSON)
      duckdb: CAST(x AS JSON)
  hex_wkb:
    renderer: engine-produced
    recover:
      bigquery: ST_GEOGFROMWKB(x)
      snowflake: TO_GEOMETRY(x)
      clickhouse: readWKB*(unhex(x))    # one reader per geometry kind
      duckdb: ST_GeomFromHEXWKB(x)
  hex_bytes:
    renderer: hex_bytes
    recover:
      bigquery: FROM_HEX(x)
      snowflake: TO_BINARY(x, 'HEX')
      clickhouse: unhex(x)
      duckdb: unhex(x)
  bit_string:
    renderer: bit_string
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: CAST(x AS BITSTRING)
  inet_text:
    renderer: engine-produced
    recover:
      bigquery: NET.IP_FROM_STRING(x)   # addresses only, no CIDR
      snowflake: PARSE_IP(x, 'INET')
      clickhouse: toIPv6(x)             # addresses only, no CIDR
      duckdb: CAST(x AS INET)
  range_text:
    renderer: engine-produced
    recover:
      bigquery: text                    # RANGE holds date/time bounds only
      snowflake: text
      clickhouse: text
      duckdb: text
  xml_text:
    renderer: engine-produced
    recover:
      bigquery: text
      snowflake: PARSE_XML(x, TRUE)
      clickhouse: text
      duckdb: text
  server_text:
    renderer: engine-produced
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text

engines:
  postgres:
    setup:
      - "DO $$ BEGIN CREATE TYPE rivet_status AS ENUM ('active','inactive','pending'); EXCEPTION WHEN duplicate_object THEN NULL; END $$"
      - "DO $$ BEGIN CREATE TYPE rivet_status_typed AS ENUM ('active','shipped','off'); EXCEPTION WHEN duplicate_object THEN NULL; END $$"
      - "DO $$ BEGIN CREATE TYPE rivet_pair AS (a int, b text); EXCEPTION WHEN duplicate_object THEN NULL; END $$"
      - "DO $$ BEGIN CREATE DOMAIN rivet_posint AS int CHECK (VALUE > 0); EXCEPTION WHEN duplicate_object THEN NULL; END $$"
    renders:
      "Binary": {duck: "lower(hex({c}))"}
      "iso8601_duration": {canon: "interval"}
      "List(Utf8)": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(Int32)": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(Float64)": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(Date32)": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(Timestamp(µs))": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(Timestamp(µs, \"UTC\"))": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(Time64(µs))": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(arrow.uuid)": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "Decimal256(60, 10)": {duck: "arrow"}
      "server_text": {server: "CASE WHEN {c} IS NOT NULL THEN format('%s', {c}) END"}
      "inet_text": {server: "CASE WHEN {c} IS NOT NULL THEN format('%s', {c}) END"}
    rows:
      - {native_type: "TEXT", sample: ["'üñíçødé ''q'''", "'hello'"], edges: ["''", "'a'", "' '", "'12'", "'-5'", "'1.5'", "'NULL'", "'0'", "'12abc'", "' 42'", "'x'", "'a''b'", "'é中😀'", "'tab\ttab'", "'nl\nnl'", "'q\"\\,;'", "'üñíçødé ''q'''", "'hello'"], delivery: "Utf8", cdc: exact, clickhouse: {type: "Nullable(String)"}}
      - {native_type: "NUMERIC(18,2)", sample: ["999999999999.99"], edges: ["9999999999999999.99", "-9999999999999999.99", "0", "0.01", "999999999999.99"], delivery: "Decimal128(18, 2)", cdc: exact, clickhouse: {type: "Nullable(Decimal(18, 2))"}}
      - {native_type: "NUMERIC(18,4)", sample: ["12345.6789"], edges: ["99999999999999.9999", "-99999999999999.9999", "0", "0.0001", "12345.6789"], delivery: "Decimal128(18, 4)", cdc: exact, clickhouse: {type: "Nullable(Decimal(18, 4))"}}
      - {native_type: "TIMESTAMP", sample: ["'2035-08-07 09:08:07.987654'"], edges: [{v: "'0001-01-01 00:00:00'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'9999-12-31 23:59:59'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, "'1970-01-02 03:04:05'", {v: "'1677-09-21 00:12:43.145224'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, "'1900-01-01 00:00:00'", {v: "'1899-12-31 23:59:59.999999'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, "'1969-12-31 23:59:59.999999'", "'1970-01-01 00:00:00'", "'2000-02-29 12:34:56.789012'", "'2262-04-11 23:47:16.854775'", "'2299-12-31 23:59:59.999999'", {v: "'2300-01-01 00:00:00'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'9999-12-31 23:59:59.999999'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'4713-01-01 00:00:00 BC'", x: "form:4713-01-01 (BC) 00:00:00", bigquery: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load", snowflake: "form:-4712-01-01 00:00:00.000000000", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'infinity'", x: "refuse:RIVET_SOURCE_VALUE_UNREPRESENTABLE@extract"}, {v: "'-infinity'", x: "refuse:RIVET_SOURCE_VALUE_UNREPRESENTABLE@extract"}, "'2035-08-07 09:08:07.987654'"], delivery: "Timestamp(µs)", cdc: exact, clickhouse: {type: "Nullable(DateTime64(6, 'UTC'))"}}
      - {native_type: "TIMESTAMPTZ", sample: ["'2019-02-03 08:07:06.554433+05'"], edges: [{v: "'0001-01-01 00:00:00'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'9999-12-31 23:59:59'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, "'1970-01-02 03:04:05'", {v: "'0001-01-01 00:00:00+00'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'1677-09-21 00:12:43.145224+00'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, "'1900-01-01 00:00:00+00'", {v: "'1899-12-31 23:59:59.999999+00'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, "'1969-12-31 23:59:59.999999+00'", "'1970-01-01 00:00:00+00'", "'2000-02-29 12:34:56.789012+00'", "'2000-07-01 12:00:00+05:30'", "'2262-04-11 23:47:16.854775+00'", "'2299-12-31 23:59:59.999999+00'", {v: "'2300-01-01 00:00:00+00'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'9999-12-31 23:59:59.999999+00'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'4713-01-01 00:00:00+00 BC'", x: "form:4713-01-01 (BC) 00:00:00+00", bigquery: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load", snowflake: "form:-4712-01-01 00:00:00.000000000 Z", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'infinity'", x: "refuse:RIVET_SOURCE_VALUE_UNREPRESENTABLE@extract"}, {v: "'-infinity'", x: "refuse:RIVET_SOURCE_VALUE_UNREPRESENTABLE@extract"}, "'2019-02-03 08:07:06.554433+05'"], delivery: "Timestamp(µs, \"UTC\")", cdc: exact, clickhouse: {type: "Nullable(DateTime64(6, 'UTC'))"}}
      - {native_type: "BYTEA", sample: ["'\\x00ff01'::bytea", "'\\xDEADBEEF'"], edges: ["'\\x'", "'\\x00'", "'\\xff'", "'\\x00ff01'", "'\\x0a0d0a'", "'\\xabababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab'", "'\\x00ff01'::bytea", "'\\xDEADBEEF'"], delivery: "Binary", cdc: exact, clickhouse: {type: "Nullable(String)"}}
      - {native_type: "UUID", sample: ["'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380011'", "'12345678-1234-1234-1234-123456789012'"], edges: [{v: "'00000000-0000-0000-0000-000000000000'", snowflake: "form:00000000000000000000000000000000"}, {v: "'ffffffff-ffff-ffff-ffff-ffffffffffff'", snowflake: "form:FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"}, {v: "'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'", snowflake: "form:A0EEBC999C0B4EF8BB6D6BB9BD380A11"}, {v: "'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380011'", snowflake: "form:A0EEBC999C0B4EF8BB6D6BB9BD380011"}, {v: "'12345678-1234-1234-1234-123456789012'", snowflake: "form:12345678123412341234123456789012"}], delivery: "arrow.uuid", cdc: exact, clickhouse: {type: "Nullable(UUID)", today: "Nullable(FixedString(16))", defect: "loads as FixedString(16) bytes where ClickHouse has a native UUID (ADR-0038 CP1, ClickHouse load step)"}}
      - {native_type: "JSONB", sample: ["'{\"n\":1}'::jsonb", "'{\"k\": \"v\", \"n\": 42}'"], edges: ["'{}'::jsonb", "'null'::jsonb", "'{}'", "'[]'", "'null'", "'1'", "'\"x\"'", "'{\"a\":[1,2,{\"b\":null}]}'", "'true'", "'{\"é\":\"😀\"}'", {v: "'1e400'", x: "form:sha:401:e646476f7143324c", bigquery: "refuse:RIVET_LOAD_WAREHOUSE_REJECTED@load", snowflake: "exact"}, {v: "'12345678901234567890123456789'", bigquery: "form:1.2345678901234568e+28"}, "'{\"n\":1}'::jsonb", "'{\"k\": \"v\", \"n\": 42}'"], delivery: "arrow.json", cdc: exact, clickhouse: {type: "Nullable(String)"}}
      - {native_type: "BOOLEAN", sample: ["TRUE", "true"], edges: ["FALSE", "false", "TRUE", "true"], delivery: "Boolean", cdc: exact, clickhouse: {type: "Nullable(Bool)"}}
      - {native_type: "SMALLINT", sample: ["32767"], edges: ["-32768", "-32767", "-255", "-128", "-127", "-1", "0", "1", "127", "128", "255", "32767"], delivery: "Int16", cdc: exact, clickhouse: {type: "Nullable(Int16)"}}
      - {native_type: "BIGINT", sample: ["9000000000000"], edges: ["-9223372036854775808", "-9007199254740993", "-9007199254740992", "-2147483648", "-2147483647", "-16777217", "-16777216", "-32768", "-32767", "-255", "-128", "-127", "-1", "0", "1", "127", "128", "255", "32767", "32768", "16777216", "16777217", "2147483647", "2147483648", "9007199254740992", "9007199254740993", "9223372036854775807", "9000000000000"], delivery: "Int64", cdc: exact, clickhouse: {type: "Nullable(Int64)"}}
      - {native_type: "DOUBLE PRECISION", sample: ["2.5", "1.5"], edges: ["0", "-2.25", "0.1", "16777216", "16777217", "1e30", "9007199254740993", "1e300", "-1", "1", "'NaN'", "'Infinity'", "'-Infinity'", {v: "'-0'", bigquery: "form:0"}, "5e-324", "1.7976931348623157e308", "-1.7976931348623157e308", "2.2250738585072014e-308", "2.5", "1.5"], delivery: "Float64", cdc: exact, clickhouse: {type: "Nullable(Float64)"}}
      - {native_type: "DATE", sample: ["'2024-03-15'"], edges: [{v: "'0001-01-01'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'9999-12-31'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, "'1970-01-02'", {v: "'1677-09-21'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'1899-12-31'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, "'1900-01-01'", "'1969-12-31'", "'1970-01-01'", "'2000-02-29'", "'2262-04-11'", "'2299-12-31'", {v: "'2300-01-01'", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'4713-01-01 BC'", x: "form:4713-01-01 (BC)", bigquery: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load", snowflake: "form:-4712-01-01", clickhouse: "refuse:RIVET_LOAD_VALUE_OUT_OF_TARGET_RANGE@load"}, {v: "'5874897-12-31'", x: "refuse:RIVET_SOURCE_VALUE_UNREPRESENTABLE@extract"}, {v: "'infinity'", x: "refuse:RIVET_SOURCE_VALUE_UNREPRESENTABLE@extract"}, {v: "'-infinity'", x: "refuse:RIVET_SOURCE_VALUE_UNREPRESENTABLE@extract"}, "'2024-03-15'"], delivery: "Date32", cdc: exact, clickhouse: {type: "Nullable(Date32)"}}
      - {native_type: "TIME", sample: ["'14:30:00.123456'"], edges: ["'00:00:00'", "'00:00:00.000001'", "'12:34:56.123456'", "'23:59:59.999999'", {v: "'24:00:00'", x: "refuse:RIVET_SOURCE_VALUE_UNREPRESENTABLE@extract"}, "'14:30:00.123456'"], delivery: "Time64(µs)", cdc: exact, clickhouse: {type: "Nullable(Decimal(18, 6))"}}
      - {native_type: "INTERVAL", sample: ["INTERVAL '1 year 2 mons 3 days'"], edges: [{v: "'0'", x: "form:PT0S"}, {v: "'1 microsecond'", x: "form:PT0.000001S"}, {v: "'-1 microsecond'", x: "form:PT-0.000001S"}, {v: "'1 year 2 mons 3 days'", x: "form:P1Y2M3D"}, {v: "'-1 year -2 mons -3 days'", x: "form:P-1Y-2M-3D"}, {v: "'1 day 02:03:04.567891'", x: "form:P1DT2H3M4.567891S"}, {v: "'178000000 years'", x: "form:P178000000Y"}, {v: "'-178000000 years'", x: "form:P-178000000Y"}, {v: "'2147483647 days'", x: "form:P2147483647D"}, {v: "'2562047788:00:00'", x: "form:PT2562047788H"}, {v: "INTERVAL '1 year 2 mons 3 days'", x: "form:P1Y2M3D"}], delivery: "iso8601_duration", cdc: exact, clickhouse: {type: "Nullable(String)"}}
      - {native_type: "rivet_status", sample: ["'active'"], edges: ["'inactive'", "'pending'", "'active'"], delivery: "Utf8", cdc: exact, clickhouse: {type: "Nullable(String)"}}
      - {native_type: "rivet_status_typed", sample: ["'off'"], edges: ["'off'"], delivery: "Utf8", cdc: exact, clickhouse: {type: "Nullable(String)"}}
      - {native_type: "JSON", sample: ["'{\"k\": [1, 2]}'::json"], edges: ["'{}'::json", "'null'::json", "'{}'", "'[]'", "'null'", "'1'", "'\"x\"'", "'{\"a\":[1,2,{\"b\":null}]}'", "'true'", "'{\"é\":\"😀\"}'", "'0.1'", "'{\"k\": [1, 2]}'::json"], delivery: "arrow.json", cdc: exact, clickhouse: {type: "Nullable(String)"}}
      - {native_type: "CHAR(8)", sample: ["'pad'"], edges: ["''", "'a'", "' '", "'12'", "'-5'", "'1.5'", "'NULL'", "'0'", "'12abc'", "' 42'", "'pad'"], delivery: "Utf8", cdc: exact, clickhouse: {type: "Nullable(String)"}}
