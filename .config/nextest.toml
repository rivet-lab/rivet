
[profile.default]
junit = { path = "junit.xml" }
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 0

[[profile.default.overrides]]
filter = 'test(/same_named_configs_share_a_postgres_state_cdc_cycle$/) or test(/same_named_configs_share_a_postgres_state_batch_cycle$/) or test(/a_cdc_baseline_over_a_wide_history_lands_in_the_base_in_batches$/) or test(/a_wide_history_read_by_keyset_loads_daily_partitions_in_batches$/) or test(/base_and_buffer_cycle_run_load_compact_keeps_deletes_as_flags$/) or test(/^live_cdc_full_cycle::/) or test(/bigquery_hourly_partitions_over_the_job_cap_load_in_budgeted_batches$/) or test(/^live_cdc_multi_table_cycle::/) or test(/^live_pool_ledger::/) or test(/^live_load_lease_keeper::a_pooled_load_/) or test(/^live_cdc_backfill::repeated_runs_of_one_config_append_only_the_delta_to_the_changelog$/) or test(/^live_load_spec::bigquery_changelog_follows_a_written_cluster_by_and_repartitions_only_on_rebuild$/) or test(/^live_load_spec::bigquery_range_and_load_time_partitions_land_as_declared$/) or test(/^live_cdc_compact::a_key_move_leaves_one_live_row_per_key_in_a_partitioned_base_/) or test(/^live_cdc_compact::an_update_of_a_replica_identity_index_reaches_the_base_as_one_update_postgres$/) or test(/^live_snowflake_load::snowflake_incremental_/) or test(/^live_snowflake_load::snowflake_full_load_that_fails_/) or test(/^live_snowflake_compact::/) or (binary(oracle_fixture_matrix) and test(/^warehouse_cell_/))'
slow-timeout = { period = "300s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(/^live_init_delta::a_0_30_cdc_state_copied_to_postgres_/)'

[[profile.default.overrides]]
filter = 'test(/^live_init_delta::a_generated_config_drives_run_load_compact_into_the_warehouse_/) or test(/^live_init_delta::a_generated_cdc_config_drives_run_load_compact_/)'
slow-timeout = { period = "300s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(/^live_cdc_mssql::/) or test(/^live_cdc_harm::a_mssql/)'
slow-timeout = { period = "120s", terminate-after = 4 }

[test-groups]
oracle = { max-threads = 4 }
toxiproxy = { max-threads = 1 }
mssql_cdc = { max-threads = 1 }
oracle_cdc = { max-threads = 1 }
pgbouncer = { max-threads = 1 }
mysql_replica = { max-threads = 1 }
warehouse_cells = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^live_oracle::every_seeded_oracle_table_exports_every_row$/) or test(/^live_oracle::wide_clob_rows_stay_within_the_memory_budget$/)'
test-group = 'oracle'
slow-timeout = { period = "300s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(oracle_fixture_matrix)'
test-group = 'warehouse_cells'

[[profile.default.overrides]]
filter = 'test(/^live_oracle::/)'
test-group = 'oracle'

[[profile.default.overrides]]
